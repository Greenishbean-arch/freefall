<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FREEFALL</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body {
  background:black;
  color:#00ff66;
  font-family:'Press Start 2P', monospace;
  text-align:center;
  margin:0;
  padding:10px;
}
button {
  background:black;
  color:#00ff66;
  border:2px solid #00ff66;
  padding:10px;
  margin:6px;
  font-family:inherit;
  font-size:11px;
}
button:active {
  background:#00ff66;
  color:black;
}
.hidden { display:none; }

#log {
  border:2px solid #00ff66;
  height:160px;
  overflow-y:auto;
  padding:6px;
  font-size:10px;
}

.bar {
  width:90%;
  height:20px;
  border:2px solid #00ff66;
  margin:10px auto;
  position:relative;
}
#indicator {
  width:6px;
  height:100%;
  background:#00ff66;
  position:absolute;
  left:0%;
}
#target {
  position:absolute;
  left:45%;
  width:10%;
  height:100%;
  background:#003322;
}
</style>
</head>

<body>

<h2>FREEFALL</h2>

<div id="menu">
  <button onclick="startGame()">PLAY</button>
</div>

<div id="charSelect" class="hidden">
  <p>CHOOSE YOUR DESCENT</p>
  <button onclick="selectChar('Spirit')">SPIRIT</button>
  <button onclick="selectChar('Mantis')">MANTIS</button>
  <button onclick="selectChar('Cacerv')">CACERV</button>
  <button onclick="selectChar('Enola')">ENOLA</button>
</div>

<div id="game" class="hidden">
  <div id="stats"></div>
  <div id="room"></div>

  <div id="combat" class="hidden">
    <button onclick="startAttack()">ATTACK</button>
    <button onclick="startDodge()">DODGE</button>
    <button onclick="useSpell()">SPELL</button>
  </div>

  <div id="attackBox" class="hidden">
    <p id="attackText"></p>
    <button onclick="registerClick()">CLICK</button>
  </div>

  <div id="dodgeBox" class="hidden">
    <p>DODGE TIMING</p>
    <div class="bar">
      <div id="target"></div>
      <div id="indicator"></div>
    </div>
    <button onclick="resolveDodge()">DODGE NOW</button>
  </div>

  <div id="explore">
    <button onclick="explore()">SEARCH / MOVE</button>
  </div>

  <div id="log"></div>
</div>

<audio id="music" loop></audio>

<script>
/* ===== DATA ===== */
const chars={
 Spirit:{hp:90,max:90,weapon:20,class:"Rogue"},
 Mantis:{hp:100,max:100,weapon:15,class:"Mage"},
 Cacerv:{hp:125,max:125,weapon:20,class:"Tank"},
 Enola:{hp:80,max:80,weapon:25,class:"Butcher"}
};

const enemies=[
 {name:"Demon",hp:75,dmg:20,type:"normal"},
 {name:"Skinwalker",hp:100,dmg:15,type:"normal"},
 {name:"Goblin",hp:25,dmg:28,type:"normal"},
 {name:"Zombie",hp:50,dmg:30,type:"undead"},
 {name:"Ghost",hp:125,dmg:8,type:"undead"}
];

const bosses=[
 {name:"False Virtue",hp:900},
 {name:"Zombie King",hp:1000},
 {name:"Demon King",hp:1200},
 {name:"The Boogie Man",hp:1250},
 {name:"The Fallen Angel",hp:2500}
];

let state={
 player:null,
 enemy:null,
 roomCount:0,
 enemyChance:0.15,
 bossChance:0,
 bossIndex:0,
 spells:[],
 clicks:0,
 clickLimit:0
};

/* ===== MUSIC ===== */
const music=document.getElementById("music");
function playMusic(t){
 music.src=`audio:${t}.mp3`;
 music.play();
}

/* ===== UI ===== */
const log=t=>{document.getElementById("log").innerHTML+=t+"<br>";};
const stats=()=>document.getElementById("stats").innerText=
`HP ${state.player.hp}/${state.player.max} | LV ${state.player.level||1}`;
const showRoom=t=>document.getElementById("room").innerText=t;

/* ===== START ===== */
function startGame(){
 playMusic("ambient");
 document.getElementById("menu").classList.add("hidden");
 document.getElementById("charSelect").classList.remove("hidden");
}

function selectChar(c){
 state.player={...chars[c],level:1};
 log("You descend as "+c+".");
 document.getElementById("charSelect").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 stats();
}

/* ===== EXPLORATION ===== */
function explore(){
 playMusic("ambient");
 state.roomCount++;
 showRoom("Exploring deeper...");
 if(Math.random()<state.enemyChance){
   spawnEnemy();
   state.enemyChance=0.15;
 } else {
   log("The room is empty.");
   state.enemyChance+=0.05;
 }
 state.bossChance+=1.5;
}

/* ===== SPAWN ===== */
function spawnEnemy(){
 if(state.roomCount<10 || Math.random()*100>state.bossChance){
   state.enemy=JSON.parse(JSON.stringify(enemies[Math.floor(Math.random()*enemies.length)]));
   log("A "+state.enemy.name+" appears!");
   startCombat();
 } else spawnBoss();
}

function spawnBoss(){
 state.enemy=JSON.parse(JSON.stringify(bosses[state.bossIndex]));
 state.bossIndex++;
 state.bossChance=0;
 log("BOSS: "+state.enemy.name);
 playMusic("boss");
 startCombat();
}

/* ===== COMBAT ===== */
function startCombat(){
 playMusic(state.enemy.hp>500?"boss":"battle");
 document.getElementById("combat").classList.remove("hidden");
 document.getElementById("explore").classList.add("hidden");
}

function endCombat(){
 playMusic("ambient");
 document.getElementById("combat").classList.add("hidden");
 document.getElementById("explore").classList.remove("hidden");
 state.enemy=null;
}

/* ===== ATTACK ===== */
function startAttack(){
 state.clicks=0;
 state.clickLimit=state.player.weapon;
 document.getElementById("attackText").innerText=
`Click Attack ${state.clickLimit} times in 4 seconds.`;
 document.getElementById("attackBox").classList.remove("hidden");
 setTimeout(resolveAttack,4000);
}

function registerClick(){
 state.clicks++;
}

function resolveAttack(){
 document.getElementById("attackBox").classList.add("hidden");
 const dmg=Math.min(state.clicks,state.clickLimit);
 state.enemy.hp-=dmg;
 log("You deal "+dmg+" damage.");
 enemyTurn();
}

/* ===== DODGE ===== */
let dodgePos=0,dir=1,interval;

function startDodge(){
 document.getElementById("dodgeBox").classList.remove("hidden");
 dodgePos=0;dir=1;
 interval=setInterval(()=>{
   dodgePos+=dir*4;
   if(dodgePos>90||dodgePos<0)dir*=-1;
   indicator.style.left=dodgePos+"%";
 },40);
}

function resolveDodge(){
 clearInterval(interval);
 document.getElementById("dodgeBox").classList.add("hidden");
 if(dodgePos>45&&dodgePos<55){
   log("Perfect dodge!");
 } else {
   const dmg=state.enemy.dmg*2;
   state.player.hp-=dmg;
   log("Failed dodge! Took "+dmg);
 }
 stats();
}

/* ===== ENEMY TURN ===== */
function enemyTurn(){
 if(state.enemy.hp<=0){
   log(state.enemy.name+" defeated.");
   if(state.enemy.hp>500){
     state.spells.push("Spell");
     log("You gained a spell.");
   }
   endCombat();
   return;
 }
 if(Math.random()<0.2){
   state.enemy.hp+=10;
   log(state.enemy.name+" heals.");
 } else {
   state.player.hp-=state.enemy.dmg;
   log(state.enemy.name+" hits for "+state.enemy.dmg);
 }
 stats();
 if(state.player.hp<=0) alert("YOU DIED");
}

/* ===== SPELL ===== */
function useSpell(){
 if(!state.spells.length){log("No spells unlocked.");return;}
 state.enemy.hp-=40;
 log("Spell hits for 40.");
 enemyTurn();
}
</script>
</body>
</html>
