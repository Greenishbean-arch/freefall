<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FREEFALL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

body {
  background:black;
  color:#00ff66;
  font-family:'Press Start 2P', monospace;
  text-align:center;
  margin:0;
  padding:10px;
}

button {
  background:black;
  border:2px solid #00ff66;
  color:#00ff66;
  font-family:inherit;
  padding:10px;
  margin:6px;
  font-size:12px;
}

button:active {
  background:#00ff66;
  color:black;
}

#log {
  height:160px;
  overflow-y:auto;
  border:2px solid #00ff66;
  padding:6px;
  margin-top:10px;
  font-size:10px;
}

.bar {
  width:90%;
  height:20px;
  border:2px solid #00ff66;
  margin:10px auto;
  position:relative;
}

#indicator {
  width:6px;
  height:100%;
  background:#00ff66;
  position:absolute;
  left:0;
}

#target {
  position:absolute;
  left:45%;
  width:10%;
  height:100%;
  background:#004422;
}

.hidden { display:none; }
</style>
</head>
<body>

<h2>FREEFALL</h2>

<div id="menu">
<button onclick="startGame()">PLAY</button>
</div>

<div id="game" class="hidden">
<div id="stats"></div>
<div id="room"></div>

<div id="combat" class="hidden">
<button onclick="attack()">ATTACK</button>
<button onclick="startDodge()">DODGE</button>
<button onclick="useItem()">ITEM</button>
<button onclick="useSpell()">SPELL</button>

<div id="attackArea" class="hidden">
<p id="attackText"></p>
<button onclick="registerClick()">CLICK</button>
</div>

<div id="dodgeArea" class="hidden">
<p>DODGE TIMING</p>
<div class="bar">
<div id="target"></div>
<div id="indicator"></div>
</div>
<button onclick="attemptDodge()">DODGE NOW</button>
</div>
</div>

<div id="explore">
<button onclick="explore()">SEARCH / MOVE</button>
</div>

<div id="log"></div>
</div>

<audio id="music" loop></audio>

<script>
/* ---------------- CORE DATA ---------------- */
const characters = {
 Spirit:{hp:90,max:90,weapon:20,alt:10,class:"Rogue"},
 Mantis:{hp:100,max:100,weapon:15,alt:8,class:"Mage"},
 Cacerv:{hp:125,max:125,weapon:20,alt:5,class:"Tank"},
 Enola:{hp:80,max:80,weapon:25,alt:20,class:"Butcher"}
};

const enemies = [
 {name:"Demon",hp:75,dmg:20,type:"normal"},
 {name:"Skinwalker",hp:100,dmg:15,type:"normal"},
 {name:"Goblin",hp:25,dmg:28,type:"normal"},
 {name:"Zombie",hp:50,dmg:30,type:"undead"},
 {name:"Ghost",hp:125,dmg:8,type:"undead"}
];

const bosses = [
 {name:"False Virtue",hp:900},
 {name:"Zombie King",hp:1000},
 {name:"Demon King",hp:1200},
 {name:"The Boogie Man",hp:1250},
 {name:"The Fallen Angel",hp:2500}
];

let state={
 player:null,
 enemy:null,
 roomCount:0,
 enemyChance:0.2,
 bossChance:0,
 bossIndex:0,
 inventory:[],
 spells:[],
 level:1,
 dmgBonus:0,
 music:"ambient"
};

/* ---------------- MUSIC ---------------- */
const music=document.getElementById("music");
function playMusic(type){
 if(state.music===type) return;
 state.music=type;
 music.src=`audio:${type}.mp3`;
 music.play();
}

/* ---------------- UI ---------------- */
const log=t=>{document.getElementById("log").innerHTML+=t+"<br>";}
const stats=()=>document.getElementById("stats").innerHTML=
`HP ${state.player.hp}/${state.player.max} | LV ${state.level}`;
const showRoom=t=>document.getElementById("room").innerText=t;

/* ---------------- START ---------------- */
function startGame(){
 playMusic("ambient");
 document.getElementById("menu").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 chooseCharacter();
}

function chooseCharacter(){
 let c=prompt("Choose: Spirit, Mantis, Cacerv, Enola");
 if(!characters[c]) return chooseCharacter();
 state.player=JSON.parse(JSON.stringify(characters[c]));
 log("You descend as "+c+".");
 stats();
}

/* ---------------- EXPLORATION ---------------- */
function explore(){
 playMusic("ambient");
 state.roomCount++;
 showRoom("Exploring...");
 if(Math.random()<state.enemyChance){
   spawnEnemy();
   state.enemyChance=0.15;
 } else {
   state.enemyChance+=0.05;
   log("The room is quiet...");
 }
 state.bossChance+=1.5;
}

/* ---------------- ENEMIES ---------------- */
function spawnEnemy(){
 if(state.roomCount<8 || Math.random()*100>state.bossChance){
   const e=JSON.parse(JSON.stringify(enemies[Math.floor(Math.random()*enemies.length)]));
   state.enemy=e;
   log("A "+e.name+" appears!");
   startCombat();
 } else {
   spawnBoss();
 }
}

function spawnBoss(){
 if(state.bossIndex>=bosses.length) return;
 state.enemy=JSON.parse(JSON.stringify(bosses[state.bossIndex]));
 state.bossIndex++;
 state.bossChance=0;
 log("BOSS: "+state.enemy.name);
 playMusic("boss");
 startCombat();
}

/* ---------------- COMBAT ---------------- */
function startCombat(){
 playMusic(state.enemy.hp>500?"boss":"battle");
 document.getElementById("combat").classList.remove("hidden");
 document.getElementById("explore").classList.add("hidden");
}

function endCombat(){
 playMusic("ambient");
 document.getElementById("combat").classList.add("hidden");
 document.getElementById("explore").classList.remove("hidden");
 state.enemy=null;
}

/* ---------------- ATTACK ---------------- */
let clicks=0,limit=0,timer=null;

function attack(){
 clicks=0;
 limit=state.player.weapon+state.dmgBonus;
 document.getElementById("attackText").innerText=
 `Click Attack ${limit} times in 4 seconds.`;
 document.getElementById("attackArea").classList.remove("hidden");
 timer=setTimeout(resolveAttack,4000);
}

function registerClick(){ clicks++; }

function resolveAttack(){
 clearTimeout(timer);
 document.getElementById("attackArea").classList.add("hidden");
 const dmg=Math.min(clicks,limit);
 state.enemy.hp-=dmg;
 log("You deal "+dmg+" damage.");
 enemyTurn();
}

/* ---------------- DODGE ---------------- */
let dodgePos=0,dodgeDir=1;

function startDodge(){
 document.getElementById("dodgeArea").classList.remove("hidden");
 dodgePos=0; dodgeDir=1;
 dodgeInterval=setInterval(()=>{
   dodgePos+=dodgeDir*5;
   if(dodgePos>90||dodgePos<0) dodgeDir*=-1;
   indicator.style.left=dodgePos+"%";
 },50);
}

function attemptDodge(){
 clearInterval(dodgeInterval);
 document.getElementById("dodgeArea").classList.add("hidden");
 if(dodgePos>45 && dodgePos<55){
   log("Perfect dodge!");
 } else {
   const dmg=state.enemy.dmg*2;
   state.player.hp-=dmg;
   log("Failed dodge! Took "+dmg);
 }
 stats();
}

/* ---------------- ENEMY TURN ---------------- */
function enemyTurn(){
 if(state.enemy.hp<=0){
   log(state.enemy.name+" defeated.");
   if(state.enemy.hp>500){
     state.spells.push("Boss Spell");
     log("You gained a spell.");
   }
   endCombat();
   return;
 }
 let dmg=state.enemy.dmg;
 if(Math.random()<0.2){
   const heal=Math.min(10,state.enemy.hp);
   state.enemy.hp+=heal;
   log(state.enemy.name+" heals.");
 } else {
   state.player.hp-=dmg;
   log(state.enemy.name+" hits for "+dmg);
 }
 stats();
 if(state.player.hp<=0) alert("YOU DIED");
}

/* ---------------- ITEMS & SPELLS ---------------- */
function useItem(){ log("Items coming from inventory."); enemyTurn(); }
function useSpell(){
 if(!state.spells.length){log("No spells.");return;}
 state.enemy.hp-=40;
 log("Spell hits for 40.");
 enemyTurn();
}
</script>
</body>
</html>
