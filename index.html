<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FREEFALL — Text RPG</title>
<style>
  :root{--bg:#070707;--panel:#0f0f0f;--accent:#b02b2b;--muted:#aaa;--text:#e9e9e9}
  html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#000);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,monospace}
  .wrap{max-width:820px;margin:12px auto;padding:12px}
  header{display:flex;align-items:center;justify-content:space-between}
  h1{font-size:20px;margin:0}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button{background:var(--panel);border:1px solid #222;color:var(--text);padding:10px;border-radius:6px;font-size:16px;cursor:pointer}
  button.full{width:100%}
  #topStatus{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
  .card{background:rgba(255,255,255,0.02);padding:8px;border:1px solid #151515;border-radius:6px;min-width:140px}
  #log{height:220px;overflow:auto;background:#050505;padding:10px;border-radius:6px;border:1px solid #111}
  .muted{color:var(--muted);font-size:13px}
  .bar{height:16px;background:#222;border-radius:6px;position:relative;margin:8px 0;overflow:hidden}
  .marker{position:absolute;top:0;height:16px;background:var(--accent);width:4px;left:0}
  .target{position:absolute;top:0;height:16px;background:rgba(176,43,43,0.25);border-left:1px solid rgba(176,43,43,0.45);border-right:1px solid rgba(176,43,43,0.45)}
  .small{font-size:13px}
  .inv{display:flex;gap:6px;flex-wrap:wrap}
  .pill{background:#111;padding:4px 8px;border-radius:999px;border:1px solid #222}
  footer{margin-top:10px;font-size:12px;color:var(--muted)}
  @media (max-width:480px){button{font-size:15px;padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>FREEFALL</h1>
    <div class="muted">Text RPG — Exploration / Horror</div>
  </header>

  <div id="menu">
    <div style="margin:10px 0">
      <button onclick="newGame()" class="full">New Game (wipe save)</button>
    </div>
    <div style="margin:10px 0">
      <button onclick="openPlay()" class="full">Play / Continue</button>
    </div>
  </div>

  <div id="playArea" class="hidden">
    <div id="topStatus"></div>

    <div id="log" aria-live="polite"></div>

    <div id="ui" style="margin-top:8px"></div>

    <div style="margin-top:8px">
      <div class="muted small">Tip: attack = click fast for 4 seconds. Dodge = timing bar. Using items counts as your turn.</div>
    </div>
  </div>

  <footer>Made for iPad / GitHub Pages. Everything auto-saves to your browser.</footer>
</div>

<script>
/* =========================
   Game data (constants)
   ========================= */

const CHARACTERS = {
  Spirit: {
    name: "Spirit",
    hp: 90, maxHp: 90,
    baseDamage: 20, altDamage: 10,
    lines: { weak: "Too easy. Next time… try harder.", undead: "Killing the Killed… how… oddly satisfying.", boss: "You were defeated, by a mere mortal." }
  },
  Mantis: {
    name: "Mantis",
    hp: 100, maxHp: 100,
    baseDamage: 15, altDamage: 8,
    lines: { weak: "My skill is unmatched! Heh.", undead: "The undead is re-dead… satisfying.", boss: "Nanana boo boo!" }
  },
  Cacerv: {
    name: "Cacerv",
    hp: 125, maxHp: 125,
    baseDamage: 20, altDamage: 5,
    lines: { weak: "HAHA! Bye bye, Birdie.", undead: "Just like in the horror films! Except I don’t die.", boss: "слишком легко" }
  },
  Enola: {
    name: "Enola",
    hp: 80, maxHp: 80,
    baseDamage: 25, altDamage: 20,
    lines: { weak: "I wonder how you would taste in a stew…", undead: "Can’t cook you... awww.", boss: "Hmmm… a Divine dish? Haha! What a wonderful idea!" }
  }
};

const ENEMIES = [
  { name: "Demon", hp: 75, dmg: 20, type: "weak" },
  { name: "Skinwalker", hp: 100, dmg: 15, type: "weak" },
  { name: "Goblin", hp: 25, dmg: 50, type: "weak" },
  { name: "Zombie", hp: 50, dmg: 30, type: "undead" },
  { name: "Ghost", hp: 125, dmg: 8, type: "undead" }
];

const BOSSES = [
  { name: "False Virtue", hp: 900, dmg: 25 },
  { name: "Zombie King", hp: 1000, dmg: 30 },
  { name: "Demon King", hp: 1200, dmg: 40 },
  { name: "The Boogie Man", hp: 1250, dmg: 45 },
  { name: "The Fallen Angel", hp: 2500, dmg: 60 }
];

const ROOM_TYPES = ["Dungeon","Poolroom","Treasure room","Dead End","Empty Room"];

/* Items + effects — each returns a message */
const ITEM_EFFECTS = {
  "Medical Pack": ()=>{ let heal = 40; g.player.hp = Math.min(g.player.maxHp, g.player.hp + heal); return `Healed ${heal} HP.`; },
  "Gluttony": ()=>{ if(!g.enemy) return "No enemy to use this on."; g.enemy.hp -= 20; return "Deals 20 damage to current enemy."; },
  "Beer": ()=>{ g.player.baseDamage += 5; return "Base damage increased by 5."; },
  "Lightning Bug": ()=>{ g.player.baseDamage += 1; return "Base damage increased by 1."; },
  "Meat": ()=>{ g.player.maxHp += 2; g.player.hp += 1; return "Max HP +2, HP +1."; },
  "Sticky Note": ()=>{ if(!g.enemy) return "No enemy."; g.enemy.nextDamageReducer = (g.enemy.nextDamageReducer||0)+5; return "Enemy's next damage reduced by 5."; }
};

const ITEM_LIST = Object.keys(ITEM_EFFECTS);

/* =========================
   Save / state
   ========================= */

let g = load();
function save(){
  try{ localStorage.setItem("freefall_save_v1", JSON.stringify(g)); }
  catch(e){ console.warn("Save failed", e); }
}
function load(){
  try{
    let raw = localStorage.getItem("freefall_save_v1");
    if(!raw) return null;
    return JSON.parse(raw);
  } catch(e){ return null; }
}
function clearSave(){ localStorage.removeItem("freefall_save_v1"); g = null; renderMenu(); }

/* =========================
   Helpers & UI
   ========================= */

const logEl = document.getElementById("log");
function log(msg){
  let time = new Date().toLocaleTimeString();
  logEl.innerHTML += `<div><span class="muted small">[${time}]</span> ${escapeHTML(msg)}</div>`;
  logEl.scrollTop = logEl.scrollHeight;
}
function escapeHTML(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function show(id){ document.getElementById(id).classList.remove("hidden"); }
function hide(id){ document.getElementById(id).classList.add("hidden"); }

/* Top status renderer */
function renderTop(){
  const top = document.getElementById("topStatus");
  if(!g){ top.innerHTML = "<div class='card'>No save loaded.</div>"; return; }
  const inv = g.items.length ? g.items.map(i=>`<span class="pill">${i}</span>`).join(" ") : "<span class='muted small'>Empty</span>";
  let enemyHtml = g.enemy ? `<div class="card"><strong>Enemy:</strong><div>${g.enemy.name} — HP ${Math.max(0,g.enemy.hp)}${g.enemy.isBoss?" (BOSS)":""}</div><div class="muted small">DMG: ${g.enemy.dmg}</div></div>` : "";
  top.innerHTML = `
    <div class="card"><strong>${g.char}</strong><div>HP: ${Math.max(0,g.player.hp)} / ${g.player.maxHp}</div><div class="muted small">Base dmg: ${g.player.baseDamage}</div><div class="muted small">Level: ${g.level}</div></div>
    <div class="card"><strong>Location</strong><div>${g.currentRoom||"—"}</div><div class="muted small">enemyChance: ${g.enemyChance.toFixed(1)}% bossChance: ${g.bossChance.toFixed(2)}%</div></div>
    <div class="card"><strong>Inventory</strong><div class="inv">${inv}</div></div>
    ${enemyHtml}
  `;
}

/* UI area */
function renderUI(html){
  document.getElementById("ui").innerHTML = html || "";
}

/* =========================
   Boot / menu
   ========================= */

function renderMenu(){
  if(g){
    document.getElementById("menu").style.display = "block";
    document.getElementById("playArea").classList.remove("hidden");
    logEl.innerHTML = ""; // keep play area clean on open
    log("Save loaded. Press Play / Continue.");
    renderTop();
    renderUI(`<div class="row"><button class="full" onclick="explore()">Continue Exploring</button><button onclick="showSaveInfo()">Save Info</button></div>`);
  } else {
    document.getElementById("menu").style.display = "block";
    document.getElementById("playArea").classList.add("hidden");
  }
}

/* Called by menu button */
function openPlay(){
  if(!g){
    // show character choice
    renderCharacterChoices();
    document.getElementById("menu").style.display = "none";
    document.getElementById("playArea").classList.remove("hidden");
    logEl.innerHTML = ""; // new session logs
    log("Choose your character.");
  } else {
    // continue with loaded save
    document.getElementById("menu").style.display = "none";
    document.getElementById("playArea").classList.remove("hidden");
    log("Continuing your run...");
    renderTop();
    if(g.battle) battleMenu();
    else renderUI(`<button class="full" onclick="explore()">Explore</button>`);
  }
}

function newGame(){
  if(confirm("Start a new run? This wipes existing save.")){
    clearSave();
    g = null;
    openPlay();
  }
}

/* =========================
   Character selection
   ========================= */

function renderCharacterChoices(){
  let html = "<div class='row'>";
  for(let key in CHARACTERS){
    const c = CHARACTERS[key];
    html += `<button onclick="chooseCharacter('${key}')" style="min-width:150px">${c.name} — HP ${c.hp}, DMG ${c.baseDamage}</button>`;
  }
  html += "</div>";
  renderUI(html);
}

function chooseCharacter(key){
  const base = CHARACTERS[key];
  g = {
    char: key,
    player: { hp: base.hp, maxHp: base.maxHp, baseDamage: base.baseDamage, altDamage: base.altDamage, lines: base.lines },
    level: 1,
    items: [],
    enemyChance: 20.0,
    bossChance: 0.0,
    bossIndex: 0,
    battle: false,
    enemy: null,
    currentRoom: null,
    progress: { roomsVisited: 0 },
    temp: {}
  };
  save();
  log(`You chose ${key}. The hole rumbles beneath you...`);
  renderTop();
  renderUI(`<button class="full" onclick="explore()">Begin the Descent</button>`);
}

/* =========================
   Exploration & Rooms
   ========================= */

function explore(){
  if(!g) return openPlay();
  g.progress.roomsVisited++;
  // pick a room
  const r = ROOM_TYPES[Math.floor(Math.random()*ROOM_TYPES.length)];
  g.currentRoom = r;
  renderTop();
  log(`You enter: ${r}.`);
  // Boss chance check
  const bossRoll = Math.random()*100;
  if(bossRoll < g.bossChance && g.bossIndex < BOSSES.length){
    startBoss();
    return;
  }
  // Enemy spawn chance (rooms like poolroom prefer certain enemies)
  let spawnRoll = Math.random()*100;
  if(r === "Dead End"){ // maybe no spawn, but small chance
    spawnRoll += 10;
  }
  if(r === "Empty Room"){
    spawnRoll -= 10; // less likely
  }
  // Determine enemy chance:
  if(spawnRoll < g.enemyChance){
    // spawn enemy influenced by room
    let enemyPool = ENEMIES.slice();
    if(r === "Poolroom") enemyPool = ENEMIES.filter(e=>e.name==="Ghost"||e.name==="Skinwalker");
    if(r === "Treasure room"){
      // Treasure room: no enemy but treasure
      treasureFound();
      postExploreIncrement();
      return;
    }
    // choose enemy
    const e = JSON.parse(JSON.stringify(enemyPool[Math.floor(Math.random()*enemyPool.length)]));
    g.enemy = e;
    g.battle = true;
    log(`An enemy appears: ${e.name} (HP ${e.hp})`);
    save();
    battleMenu();
    return;
  } else {
    // no enemy; maybe a treasure room has chance for treasure
    if(r === "Treasure room"){ treasureFound(); postExploreIncrement(); return; }
    log("The room is quiet. Nothing of immediate danger.");
    postExploreIncrement();
    renderUI(`<button class="full" onclick="explore()">Go Deeper</button>`);
  }
}

function postExploreIncrement(){
  g.enemyChance = Math.max(5, g.enemyChance + 5); // goes up as player advances
  g.bossChance = Math.max(0, g.bossChance + 1.5);
  save();
  renderTop();
}

/* Treasure room handler */
function treasureFound(){
  // add one guaranteed treasure
  const it = ITEM_LIST[Math.floor(Math.random()*ITEM_LIST.length)];
  g.items.push(it);
  save();
  log(`Treasure room: you found a "${it}".`);
  renderUI(`<button class="full" onclick="explore()">Continue</button>`);
}

/* =========================
   Boss logic
   ========================= */

function startBoss(){
  const b = JSON.parse(JSON.stringify(BOSSES[g.bossIndex]));
  b.isBoss = true;
  g.enemy = b;
  g.battle = true;
  g.bossIndex++;
  g.bossChance = 0;
  save();
  log(`A BOSS stands in your path: ${g.enemy.name} (HP ${g.enemy.hp})`);
  battleMenu();
}

/* =========================
   Battle UI & flow
   ========================= */

function battleMenu(){
  renderTop();
  if(!g || !g.battle || !g.enemy) { renderUI(`<button class="full" onclick="explore()">Explore</button>`); return; }
  let html = `<div class="row">
    <button onclick="startAttack()" style="min-width:120px">Attack</button>
    <button onclick="startDodge()" style="min-width:120px">Dodge (timing)</button>
    <button onclick="openItemMenu()" style="min-width:120px">Use Item</button>
    <button onclick="attemptFlee()" style="min-width:120px">Search / Move (Try flee)</button>
  </div>
  <div style="margin-top:8px" class="muted small">Enemy HP: ${Math.max(0,g.enemy.hp)}</div>
  `;
  renderUI(html);
}

/* Attempt flee / move: counts as a turn and enemy may attack */
function attemptFlee(){
  log("You try to move away / search the room (counts as a turn).");
  // small chance to escape enemy without fight
  if(Math.random() < 0.25){
    log("You slip away successfully.");
    // reset enemy chance slightly and remove current enemy
    g.enemy = null; g.battle = false;
    g.enemyChance = Math.max(15, g.enemyChance - 5);
    save();
    explore();
    return;
  } else {
    log("You couldn't escape; the enemy reacts.");
    // enemy gets a free hit (enemyTurn invoked but mark that we already used a turn)
    save();
    enemyTurn();
  }
}

/* =========================
   Attack mini-game (click spam)
   ========================= */

function startAttack(){
  if(!g || !g.enemy) return;
  // determine weapon damage: use baseDamage as neededClicks
  const needed = Math.max(1, Math.floor(g.player.baseDamage));
  g.temp.attack = { needed: needed, clicks: 0, start: Date.now(), timeout: 4000, finished: false };
  log(`ATTACK - Click the CLICK button rapidly up to ${needed} times in 4 seconds.`);
  renderUI(`<div class="row"><button id="attackClickBtn" class="full">CLICK</button></div><div class="muted small">Clicks: <span id="clickCount">0</span> / ${needed}</div>`);
  // bind click
  const btn = document.getElementById("attackClickBtn");
  function clickHandler(){
    if(!g || !g.temp || g.temp.attack.finished) return;
    if(g.temp.attack.clicks < g.temp.attack.needed){
      g.temp.attack.clicks++;
      document.getElementById("clickCount").innerText = g.temp.attack.clicks;
    }
  }
  btn.addEventListener("click", clickHandler);
  // timer to finish
  g.temp.attack.timer = setTimeout(()=>{
    g.temp.attack.finished = true;
    btn.removeEventListener("click", clickHandler);
    const dealt = Math.min(g.temp.attack.clicks, g.temp.attack.needed);
    g.enemy.hp -= dealt;
    log(`You dealt ${dealt} damage.`);
    // after attack, count as player's turn -> enemyTurn() unless enemy died
    save();
    setTimeout(()=> enemyTurn(), 300);
  }, g.temp.attack.timeout);
}

/* =========================
   Dodge mini-game (timing)
   ========================= */

function startDodge(){
  if(!g || !g.enemy) return;
  // We'll render a bar with moving marker and a fixed target zone.
  const barWidth = 300; // px — relative on screen, it's fine for iPad
  const targetSize = Math.floor(Math.random() * 60) + 40; // px wide
  const targetPos = Math.floor(Math.random() * (barWidth - targetSize));
  // store in temp
  g.temp.dodge = { barWidth, targetSize, targetPos, markerPos: 0, dir: 1, speed: 3, running: true };
  // UI
  renderUI(`
    <div style="margin-bottom:6px">DODGE - Press "Attempt Dodge" when the red marker crosses the target zone. Success: avoid damage. Fail: you take double damage immediately.</div>
    <div class="bar" id="dodgeBar" style="width:${barWidth}px;position:relative">
      <div class="target" id="dodgeTarget" style="left:${targetPos}px;width:${targetSize}px"></div>
      <div class="marker" id="dodgeMarker" style="left:0px"></div>
    </div>
    <div class="row"><button onclick="attemptDodge()" style="min-width:140px">Attempt Dodge</button><button onclick="cancelDodge()">Cancel</button></div>
  `);
  // start moving marker
  g.temp.dodge.interval = setInterval(()=> {
    const d = g.temp.dodge;
    if(!d.running) return;
    d.markerPos += d.dir * d.speed;
    if(d.markerPos <= 0){ d.markerPos = 0; d.dir = 1; }
    if(d.markerPos >= d.barWidth - 4){ d.markerPos = d.barWidth - 4; d.dir = -1; }
    const markerEl = document.getElementById("dodgeMarker");
    if(markerEl) markerEl.style.left = d.markerPos + "px";
  }, 16);
}

function cancelDodge(){
  if(g.temp.dodge && g.temp.dodge.interval) clearInterval(g.temp.dodge.interval);
  g.temp.dodge = null;
  log("You decide not to dodge (counts as no action).");
  // Using nothing — allow player to choose again without consuming turn
  battleMenu();
}

function attemptDodge(){
  if(!g.temp.dodge) return;
  const d = g.temp.dodge;
  // stop marker
  clearInterval(d.interval);
  d.running = false;
  const markerCenter = d.markerPos + 2; // marker width 4
  const targetLeft = d.targetPos;
  const targetRight = d.targetPos + d.targetSize;
  if(markerCenter >= d.targetPos && markerCenter <= d.targetPos + d.targetSize){
    // success => skip enemy's attack this turn
    log("DODGE SUCCESS! You evade the incoming attack.");
    g.temp.dodge = null;
    save();
    // counts as player's turn, but enemy's attack is avoided — so enemy still uses its turn but it does nothing (we call enemyTurn with skip=true)
    setTimeout(()=> enemyTurn(true), 250);
  } else {
    // failed dodge -> immediate double damage and counts as turn; enemy does not then attack again (counts as both player's & enemy's turns)
    const dmg = (g.enemy.nextDamageReducer ? Math.max(0,g.enemy.dmg - g.enemy.nextDamageReducer) : g.enemy.dmg) * 2;
    g.player.hp -= dmg;
    log(`DODGE FAILED! You take ${dmg} damage (double).`);
    // clear potential reducer after application? we treat sticky note reduces next attack; if used it applies when enemy would attack; for dodge fail it should apply as well; above used nextDamageReducer.
    if(g.enemy.nextDamageReducer) delete g.enemy.nextDamageReducer;
    g.temp.dodge = null;
    save();
    setTimeout(()=> checkAfterTurn(), 250);
  }
}

/* =========================
   Items UI & usage
   ========================= */

function openItemMenu(){
  if(!g) return;
  if(g.items.length === 0){
    log("You have no items.");
    // using an item would count as a turn; but since none, we don't consume turn.
    battleMenu();
    return;
  }
  let html = "<div class='row'>";
  g.items.forEach((it, idx) => {
    html += `<button onclick="useItem(${idx})">${escapeHTML(it)}</button>`;
  });
  html += "</div><div style='margin-top:6px'><button onclick='battleMenu()'>Back</button></div>`;
  renderUI(html);
}

function useItem(index){
  if(!g || index < 0 || index >= g.items.length) return;
  const item = g.items.splice(index,1)[0];
  const effect = ITEM_EFFECTS[item];
  let msg = "Used " + item + ".";
  try{
    const res = effect();
    if(res) msg += " " + res;
  }catch(e){ msg += " (oddly nothing happened)"; }
  log(msg);
  save();
  // using an item is a turn — enemy acts next
  setTimeout(()=> enemyTurn(), 300);
}

/* =========================
   Enemy turn & enemy behavior
   ========================= */

function enemyTurn(skip=false){
  // skip: if true, enemy's attack is skipped (used for dodge success)
  if(!g || !g.enemy){ g.battle = false; save(); battleMenu(); return; }
  if(g.enemy.hp <= 0){
    // enemy already dead
    handleVictory();
    return;
  }
  // Enemy heal decision (30% chance)
  if(!skip && Math.random() < 0.30){
    const heal = Math.floor(Math.random()*10) + 1;
    g.enemy.hp += heal;
    log(`${g.enemy.name} uses a dark stitch to heal ${heal} HP.`);
    save();
    // heals counts as enemy's turn — return to player
    setTimeout(()=> battleMenu(), 300);
    return;
  }
  if(skip){
    log(`${g.enemy.name} lunges... but you evade the attack.`);
    save();
    setTimeout(()=> battleMenu(), 300);
    return;
  }
  // Normal attack
  let damage = g.enemy.dmg;
  if(g.enemy.nextDamageReducer){
    damage = Math.max(0, damage - g.enemy.nextDamageReducer);
    delete g.enemy.nextDamageReducer;
  }
  g.player.hp -= damage;
  log(`${g.enemy.name} hits you for ${damage} damage.`);
  save();
  setTimeout(()=> checkAfterTurn(), 300);
}

/* =========================
   End-turn checks & death/victory
   ========================= */

function checkAfterTurn(){
  if(g.player.hp <= 0){
    log("You have been slain. The void takes you.");
    // Clear save on death to force restart
    localStorage.removeItem("freefall_save_v1");
    g = null;
    renderTop();
    renderUI(`<button class="full" onclick="openPlay()">Return to Menu</button>`);
    return;
  }
  if(g.enemy && g.enemy.hp <= 0){
    handleVictory();
    return;
  }
  // otherwise, continue battle as player's turn
  battleMenu();
}

/* Victory handler */
function handleVictory(){
  const wasBoss = !!g.enemy.isBoss;
  const enemyName = g.enemy.name;
  // voiceline
  const type = wasBoss ? "boss" : (g.enemy.type||"weak");
  const line = g.player.lines && (g.player.lines[type] || g.player.lines.weak) || "";
  log(`${enemyName} defeated. ${line ? `"${line}"` : ""}`);
  // kill reward: small item chance + slow progression
  // drop: 25% chance of an item
  if(Math.random() < 0.25){
    const it = ITEM_LIST[Math.floor(Math.random()*ITEM_LIST.length)];
    g.items.push(it);
    log(`You found an item: ${it}`);
  }
  // After enemy dies: reset battle, give level-up choice
  g.battle = false;
  g.enemy = null;
  // boss resets bossChance and enemyChance adjust
  if(wasBoss){
    g.enemyChance = 15;
    g.bossChance = 0;
  }
  // small reduction in enemyChance after fight
  g.enemyChance = Math.max(10, g.enemyChance - 5);
  // XP & Level: simple immediate level for every kill (slow progression claimed by small increments)
  g.level = (g.level || 1) + 1;
  save();
  renderTop();
  // show level-up choices
  renderLevelUp();
}

/* =========================
   Level up choices
   ========================= */

function renderLevelUp(){
  renderUI(`<div style="margin-bottom:8px">Level Up! Choose one:</div>
    <div class="row">
      <button onclick="applyLevel('hp')">Increase Health (+10 max HP)</button>
      <button onclick="applyLevel('dmg')">Increase Base Damage (+3)</button>
      <button onclick="applyLevel('treasure')">Get a Random Treasure</button>
    </div>`);
}

function applyLevel(choice){
  if(choice === 'hp'){
    g.player.maxHp += 10;
    g.player.hp += 10;
    log("You feel sturdier. Max HP +10.");
  } else if(choice === 'dmg'){
    g.player.baseDamage += 3;
    log("Your strikes grow stronger. Base damage +3.");
  } else {
    const it = ITEM_LIST[Math.floor(Math.random()*ITEM_LIST.length)];
    g.items.push(it);
    log(`You receive a strange treasure: ${it}`);
  }
  save();
  // after leveling, continue exploration
  renderTop();
  renderUI(`<button class="full" onclick="explore()">Continue</button>`);
}

/* =========================
   Utility / startup
   ========================= */

function showSaveInfo(){
  if(!g) { log("No save present."); return; }
  log(`Save details: char=${g.char}, level=${g.level}, roomsVisited=${g.progress.roomsVisited || 0}`);
}

/* If there's a loaded save, show it; otherwise show menu */
(function init(){
  if(g){
    // ensure player.lines exist (in case of older saves)
    if(!g.player.lines && CHARACTERS[g.char]) g.player.lines = CHARACTERS[g.char].lines;
    renderTop();
    // show a minimal UI with continue button
    document.getElementById("menu").style.display = "block";
    document.getElementById("playArea").classList.remove("hidden");
    log("Save found. Press Play / Continue.");
    renderUI(`<button class="full" onclick="explore()">Explore</button>`);
  } else {
    // show new game menu
    document.getElementById("menu").style.display = "block";
    document.getElementById("playArea").classList.add("hidden");
  }
})();

/* expose some functions for buttons via global scope (already global by declaration) */
window.openPlay = openPlay;
window.newGame = newGame;
window.chooseCharacter = chooseCharacter;
window.explore = explore;
window.startAttack = startAttack;
window.startDodge = startDodge;
window.cancelDodge = cancelDodge;
window.attemptDodge = attemptDodge;
window.openItemMenu = openItemMenu;
window.useItem = useItem;
window.attemptFlee = attemptFlee;
window.battleMenu = battleMenu;
window.renderTop = renderTop;
window.clearSave = clearSave;
window.showSaveInfo = showSaveInfo;
</script>
