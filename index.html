<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FREEFALL — Text RPG</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--green:#00ff66;--bg:#000;--panel:#00160f}
html,body{height:100%;margin:0;background:var(--bg);color:var(--green);font-family:'Press Start 2P',monospace;font-size:13px}
.wrap{max-width:920px;margin:10px auto;padding:12px;text-align:center}
button{background:transparent;color:var(--green);border:2px solid var(--green);padding:10px;margin:6px;cursor:pointer;font-family:inherit}
button:active{background:var(--green);color:#000}
.card{border:2px solid var(--green);padding:8px;background:var(--panel);display:inline-block}
.small{font-size:11px;color:var(--green)}
#log{width:94%;max-width:860px;margin:8px auto;padding:10px;height:180px;overflow:auto;border:2px solid var(--green);background:#00160f;text-align:left}
.bar{width:90%;max-width:860px;height:18px;border:2px solid var(--green);margin:8px auto;position:relative;background:#00160f}
.target{position:absolute;top:0;height:100%;background:rgba(0,255,102,0.12);border-left:1px solid rgba(0,255,102,0.2);border-right:1px solid rgba(0,255,102,0.2)}
.indicator{position:absolute;top:0;width:6px;height:100%;background:var(--green);left:0}
.hidden{display:none}
.invList{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pill{padding:6px 8px;border:1px solid var(--green);display:inline-block}
#enemyHPBox{margin-top:8px}
#enemyFill{height:100%;background:rgba(0,255,102,0.6);width:0%}
.levelCard{display:inline-block;padding:6px 10px;border:2px solid var(--green);margin:6px}
</style>
</head>
<body>
<div class="wrap">
<h1>FREEFALL</h1>

<!-- MENU -->
<div id="menu">
<button id="playBtn">PLAY</button>
</div>

<!-- CHARACTER SELECT -->
<div id="charSelect" class="hidden">
<div class="card small">CHOOSE YOUR CHARACTER</div>
<div style="margin-top:8px">
<button class="charBtn" data-char="Spirit">SPIRIT — Rogue (90 HP) Knife 20 / Fists 10</button>
<button class="charBtn" data-char="Mantis">MANTIS — Mage (100 HP) Orb 15 / Kick 8</button>
<button class="charBtn" data-char="Cacerv">CACERV — Tank (125 HP) Hammer 20 / Fists 5</button>
<button class="charBtn" data-char="Enola">ENOLA — Butcher (80 HP) Machete 25 / Scissors 20</button>
</div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
<div id="playerCard" class="card">PLAYER</div>
<div id="roomCard" class="card">ROOM</div>
<div id="invCard" class="card">Inventory<div id="invSummary" class="small"></div></div>
</div>

<div style="margin-top:8px">
<button id="exploreBtn">SEARCH / MOVE</button>
<button id="inventoryBtn">INVENTORY</button>
<button id="spellsBtn">SPELLS</button>
</div>

<!-- action area -->
<div id="combatArea" class="hidden" style="margin-top:8px">
<button id="attackBtn">ATTACK</button>
<button id="dodgeBtn">DODGE</button>
<button id="comboBtn">COMBOS</button>
</div>

<!-- attack click area -->
<div id="attackBox" class="hidden" style="margin-top:8px">
<div id="attackText" class="small"></div>
<div style="margin-top:6px"><button id="clickBtn">CLICK</button> <span id="clickCounter" class="small">0</span></div>
</div>

<!-- dodge UI -->
<div id="dodgeBox" class="hidden" style="margin-top:8px">
<div class="small">Press DODGE NOW while the marker is inside the highlighted zone.</div>
<div class="bar" id="dodgeBar">
<div id="dodgeTarget" class="target"></div>
<div id="dodgeIndicator" class="indicator"></div>
</div>
<div style="margin-top:6px"><button id="dodgeNowBtn">DODGE NOW</button></div>
</div>

<div id="exploreDetails" class="small" style="margin-top:8px"></div>

<div id="log"></div>

<!-- enemy HP display under log -->
<div id="enemyHPBox" class="hidden small">
<div id="enemyText"></div>
<div class="bar" style="height:12px">
<div id="enemyFill"></div>
</div>
</div>

<div style="margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
<div class="levelCard small">Level: <span id="levelNum">1</span> XP: <span id="xpNum">0</span></div>
<div class="card small">Quick Inventory<div id="quickInv" class="invList"></div></div>
</div>
</div>

<!-- inventory modal -->
<div id="inventoryPanel" class="hidden" style="margin-top:10px">
<div class="card small">INVENTORY — Tap to USE (Torch is reusable)</div>
<div id="inventoryList" style="margin-top:10px"></div>
<div style="margin-top:8px"><button id="closeInvBtn">CLOSE</button></div>
</div>

<!-- spells modal -->
<div id="spellsPanel" class="hidden" style="margin-top:10px">
<div class="card small">SPELLS</div>
<div id="spellsList" style="margin-top:8px"></div>
<div style="margin-top:8px"><button id="closeSpellsBtn">CLOSE</button></div>
</div>

<!-- level up modal -->
<div id="levelPanel" class="hidden" style="margin-top:10px">
<div class="card small">LEVEL UP — Choose</div>
<div style="margin-top:8px">
<button id="lvlHpBtn">Increase Max HP (+10)</button>
<button id="lvlDmgBtn">Increase Damage (+3)</button>
<button id="lvlTreasureBtn">Random Treasure</button>
</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', ()=>{

/* ========== DATA ========== */
const PLAYER_TEMPLATES = {
Spirit:{name:"Spirit",class:"Rogue",hp:90,maxHp:90,primaryName:"Knife",primaryDmg:20,altName:"Fists",altDmg:10},
Mantis:{name:"Mantis",class:"Mage",hp:100,maxHp:100,primaryName:"Magic Orb",primaryDmg:15,altName:"Kick",altDmg:8},
Cacerv:{name:"Cacerv",class:"Tank",hp:125,maxHp:125,primaryName:"Hammer",primaryDmg:20,altName:"Fists",altDmg:5},
Enola:{name:"Enola",class:"Butcher",hp:80,maxHp:80,primaryName:"Machete",primaryDmg:25,altName:"Scissors",altDmg:20}
};

const ENEMIES = [
{name:"Demon",hp:75,dmg:20,type:"demon"},
{name:"Skinwalker",hp:100,dmg:15,type:"skinwalker"},
{name:"Ghost",hp:125,dmg:8,type:"ghost"},
{name:"Zombie",hp:50,dmg:28,type:"zombie"},
{name:"Goblin",hp:25,dmg:28,type:"goblin"}
];

const BOSSES = [
{name:"False Virtue",hp:900},
{name:"Zombie King",hp:1000},
{name:"Demon King",hp:1200},
{name:"The Boogie Man",hp:1250},
{name:"The Fallen Angel",hp:2500}
];

const STARTING_ITEMS = {
"Meat":1, "Lightning Bug":1, "Sticky Note":1, "Shell":1, "Beer":1, "Torch":1
};

const BOSS_SPELLS = [
{name:"Smite",desc:"Deal 50 direct damage."},
{name:"Rot Nova",desc:"Deal 35 damage and reduce enemy damage next turn by 10."},
{name:"Hellbrand",desc:"Deal 70 damage and take 10 recoil."},
{name:"Fear Lock",desc:"Enemy loses next turn."},
{name:"Divine Sever",desc:"Deal 200 damage (permanent special, saved)."}
];

/* ========== STATE ========== */
let state = {
player:null,
items:{},
spells:[],
permSpell:null,
roomCount:0,
enemyChance:20.0,
bossChance:0.0,
bossIndex:0,
inCombat:false,
enemy:null,
enemyQueue:null,
enemySkipNext:false,
tempDamageBoost:0,
tempDamageBoostTurns:0,
level:1,
xp:0,
xpToLevel:100,
clickTarget:0,
clicks:0,
attackStartMs:0
};

/* load permanent spell */
try{
const p = localStorage.getItem('freefall_perm_spell'); if(p) state.permSpell = p;
}catch(e){}

/* ========== UTIL ========== */
const $ = id => document.getElementById(id);
const log = (t) => { const L = $('log'); L.innerHTML += t + "<br>"; L.scrollTop = L.scrollHeight; };
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* ========== UI UPDATE ========== */
function updateHUD(){
if(!state.player) return;
$('playerCard').innerHTML = `<strong>${state.player.name}</strong><div class="small">${state.player.class}</div>
<div class="small">HP: ${Math.max(0,state.player.hp)}/${state.player.maxHp}</div>
<div class="small">Primary: ${state.player.primaryName} ${state.player.primaryDmg} | Alt: ${state.player.altName} ${state.player.altDmg}</div>`;
$('roomCard').innerHTML = `<div class="small">Rooms: ${state.roomCount}</div>`;
$('invSummary').innerText = Object.entries(state.items).filter(([k,v])=>v>0).map(([k,v])=>`${k} x${v}`).join(" • ") || "Empty";
$('levelNum').innerText = state.level;
$('xpNum').innerText = `${state.xp}/${state.xpToLevel}`;
// quick inv
const quick = $('quickInv'); quick.innerHTML = "";
Object.entries(state.items).forEach(([k,v])=>{
if(v>0){ const p = document.createElement('div'); p.className='pill'; p.innerText = `${k}(${v})`; quick.appendChild(p); }
});
updateEnemyHP();
}

function updateEnemyHP(){
if(state.inCombat && state.enemy){
$('enemyHPBox').classList.remove('hidden');
$('enemyText').innerText = `${state.enemy.name} — HP ${Math.max(0,Math.floor(state.enemy.hp))}`;
const orig = state.enemy.origHp || state.enemy.hp || 1;
$('enemyFill').style.width = clamp((state.enemy.hp / orig) * 100, 0, 100)+'%';
} else $('enemyHPBox').classList.add('hidden');
}

/* ========== START & CHAR SELECT ========== */
$('playBtn').addEventListener('click', ()=>{
$('menu').classList.add('hidden'); $('charSelect').classList.remove('hidden');
});

document.querySelectorAll('.charBtn').forEach(b=>{
b.addEventListener('click', ()=> { beginRun(b.dataset.char); });
});

function beginRun(charKey){
const tpl = PLAYER_TEMPLATES[charKey];
state.player = {
name: tpl.name, class: tpl.class, hp: tpl.hp, maxHp: tpl.maxHp,
primaryName: tpl.primaryName, primaryDmg: tpl.primaryDmg,
altName: tpl.altName, altDmg: tpl.altDmg
};
state.items = JSON.parse(JSON.stringify(STARTING_ITEMS));
state.spells = [];
state.roomCount = 0;
state.enemyChance = 20.0;
state.bossChance = 0.0;
state.bossIndex = 0;
state.inCombat = false; state.enemy = null; state.enemyQueue = null;
state.enemySkipNext = false; state.tempDamageBoost = 0; state.tempDamageBoostTurns = 0;
state.level = 1; state.xp = 0; state.xpToLevel = 100;

$('charSelect').classList.add('hidden'); $('hud').classList.remove('hidden');
$('inventoryPanel').classList.add('hidden'); $('spellsPanel').classList.add('hidden');
$('levelPanel').classList.add('hidden'); $('combatArea').classList.add('hidden');
$('attackBox').classList.add('hidden'); $('dodgeBox').classList.add('hidden');
$('enemyHPBox').classList.add('hidden'); $('exploreDetails').innerText = "";
log("You enter the underworld… rage fills you.");
updateHUD();
}

/* ======= INVENTORY button ====== */
$('inventoryBtn').addEventListener('click', openInventory);
$('closeInvBtn').addEventListener('click', ()=>{$('inventoryPanel').classList.add('hidden');});

function openInventory(){
const container = $('inventoryList'); container.innerHTML = "";
Object.keys(state.items).forEach(k=>{
const qty = state.items[k]||0;
const row = document.createElement('div'); row.style.margin='6px';
const label = document.createElement('span'); label.className='small'; label.innerText = `${k} x${qty}`;
const useBtn = document.createElement('button'); useBtn.innerText = "USE";
useBtn.disabled = (qty<=0 && k!=="Torch");
useBtn.addEventListener('click', ()=>{ useItem(k); openInventory(); });
row.appendChild(label); row.appendChild(useBtn); container.appendChild(row);
});
// combo button
const comboRow = document.createElement('div'); comboRow.style.margin='8px';
const comboBtn = document.createElement('button'); comboBtn.innerText="COMBINE: Beer + Lightning Bug -> +10 (next attack)";
comboBtn.disabled = !((state.items["Beer"]||0)>0&&(state.items["Lightning Bug"]||0)>0);
comboBtn.addEventListener('click', ()=>{ state.items["Beer"]--; state.items["Lightning Bug"]--; state.tempDamageBoost=10; state.tempDamageBoostTurns=1; log("Combo! +10 damage next attack."); openInventory(); });
comboRow.appendChild(comboBtn); container.appendChild(comboRow);
$('inventoryPanel').classList.remove('hidden');
updateHUD();
}

function useItem(name){
if((state.items[name]||0)<=0 && name!=="Torch"){ log("No "+name); return; }
if(name==="Torch"){ log("You light your Torch."); return; }
if(name==="Meat"){ state.items[name]--; state.player.maxHp+=5; state.player.hp=Math.min(state.player.maxHp,state.player.hp+10); log("You eat Meat: +10 HP, +5 max HP."); updateHUD(); return; }
if(name==="Lightning Bug"){ state.items[name]--; state.player.primaryDmg+=1; log("Lightning Bug: +1 primary damage this run."); updateHUD(); return; }
if(name==="Sticky Note"){ state.items[name]--; state.enemySkipNext=true; log("Sticky Note: enemy skips next turn."); return; }
if(name==="Shell"){ state.items[name]--; log("Shell used (effect depends on room)."); updateHUD(); return; }
if(name==="Beer"){ state.items[name]--; state.player.primaryDmg+=5; log("Beer: +5 primary damage this run."); updateHUD(); return; }
}

/* ===== COMBAT ===== */
$('attackBtn').addEventListener('click', ()=>{ if(state.enemy) startAttack(); else log("No enemy."); });

function startAttack(){
state.clickTarget=Math.max(1,state.player.primaryDmg+(state.tempDamageBoost||0));
state.clicks=0; state.attackStartMs=0;
$('attackText').innerText=`Click Attack ${state.clickTarget} Amount of times in 4 seconds.`;
$('clickCounter').innerText='0'; $('attackBox').classList.remove('hidden'); $('clickBtn').disabled=false;
setTimeout(resolveAttack,4000);
}

$('clickBtn').addEventListener('click', ()=>{
if(state.clicks===0) state.attackStartMs=Date.now();
state.clicks++; $('clickCounter').innerText=state.clicks;
});

function resolveAttack(){
$('attackBox').classList.add('hidden');
const clicks=state.clicks||0; const target=state.clickTarget||1;
let damage=Math.min(clicks,target);
if(clicks>=target && state.attackStartMs && (Date.now()-state.attackStartMs)<=2000 && Math.random()<0.4){
damage+=Math.ceil(target*0.5); log("Critical hit!"); }
if(state.tempDamageBoost && state.tempDamageBoostTurns>0){ damage+=state.tempDamageBoost; state.tempDamageBoostTurns--; if(state.tempDamageBoostTurns<=0) state.tempDamageBoost=0; }
state.enemy.hp-=damage; log(`You deal ${damage} damage to ${state.enemy.name}.`);
updateEnemyHP();
if(state.enemy.hp<=0) { state.enemy.hp=0; enemyDefeated(); } else setTimeout(enemyTurn,500);
}

function enemyDefeated(){
log(`You defeated ${state.enemy.name}!`);
if(state.enemy.dmg) log(`XP gained: 50`); else log(`Boss defeated! Massive XP!`);
state.inCombat=false; state.enemy=null;
updateHUD();
$('combatArea').classList.add('hidden'); $('attackBox').classList.add('hidden'); $('dodgeBox').classList.add('hidden');
}

/* ===== DODGE ===== */
$('dodgeBtn').addEventListener('click', ()=>{$('dodgeBox').classList.remove('hidden');});
$('dodgeNowBtn').addEventListener('click', ()=>{ log("You attempt a dodge."); $('dodgeBox').classList.add('hidden'); });

/* ===== SEARCH/MOVE ===== */
$('exploreBtn').addEventListener('click', exploreRoom);

function exploreRoom(){
state.roomCount++;
$('exploreDetails').innerText = "You explore the room…";
updateHUD();
const chance=Math.random()*100;
if(chance<state.enemyChance){ spawnEnemy(); }
}

function spawnEnemy(){
state.inCombat=true;
const e=JSON.parse(JSON.stringify(ENEMIES[Math.floor(Math.random()*ENEMIES.length)]));
e.origHp=e.hp;
state.enemy=e;
log(`A wild ${e.name} appears!`);
$('combatArea').classList.remove('hidden');
updateHUD();
}
});
</script>
</div>
</body>
</html>
