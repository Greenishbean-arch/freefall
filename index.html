<!DOCTYPE html>
<html>
<head>
  <title>Freefall</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
  <style>
    body {
      background-color: #000;
      color: #0f0;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    #game {
      padding: 10px;
    }
    button, select {
      font-family: 'Press Start 2P';
      font-size: 14px;
      color: #0f0;
      background: #000;
      border: 2px solid #0f0;
      padding: 10px;
      margin: 5px;
      cursor: pointer;
    }
    #log {
      width: 90%;
      max-width: 600px;
      height: 200px;
      border: 2px solid #0f0;
      margin: 10px auto;
      padding: 5px;
      overflow-y: auto;
      text-align: left;
      font-size: 12px;
      background: #002200;
    }
    #stats {
      width: 90%;
      max-width: 600px;
      margin: 5px auto;
      text-align: left;
    }
    #enemy-stats, #player-stats {
      margin: 5px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
<div id="game">
  <div id="start-screen">
    <h1>Freefall</h1>
    <button id="start-button">Start Game</button>
  </div>
  <div id="char-screen" class="hidden">
    <h2>Choose Your Character</h2>
    <button class="char-button" data-char="Spirit">Spirit (Rogue)</button>
    <button class="char-button" data-char="Mantis">Mantis (Mage)</button>
    <button class="char-button" data-char="Cacerv">Cacerv (Tank)</button>
    <button class="char-button" data-char="Enola">Enola (Butcher)</button>
  </div>
  <div id="game-screen" class="hidden">
    <div id="stats">
      <div id="player-stats"></div>
      <div id="enemy-stats"></div>
    </div>
    <div id="log"></div>
    <div id="actions">
      <button id="explore-button" class="hidden">Explore</button>
      <button id="attack-button" class="hidden">Attack (Click Minigame)</button>
      <button id="dodge-button" class="hidden">Dodge!</button>
      <button id="use-item-button" class="hidden">Use Item</button>
      <button id="use-spell-button" class="hidden">Use Spell</button>
    </div>
  </div>
</div>
<audio id="music" loop>
  <source id="music-source" src="" type="audio/mpeg">
</audio>
<script>
// --- Game Variables ---
let character = null;
let player = {
  name: "",
  maxHP: 0,
  hp: 0,
  baseDamage: 0,
  secDamage: 0,
  level: 1,
  xp: 0,
  xpToLevel: 100,
  items: {},
  spells: []
};
let enemy = null;
let inCombat = false;
let bossFight = false;
let enemyChance = 0.2;  // chance to spawn enemy
let bossChance = 0;     // chance to spawn boss
let roomsCleared = 0;
let bossCount = 0;
window.autoDodge = false;

// Enemy and Boss definitions
const enemies = [
  { name: "Goblin", hp: 50, damage: 10 },
  { name: "Skeleton", hp: 60, damage: 12 },
  { name: "Ghoul", hp: 70, damage: 15 },
  { name: "Spider", hp: 40, damage: 8 },
  { name: "Zombie", hp: 80, damage: 14 }
];
const ghostPool = [
  { name: "Ghost", hp: 40, damage: 10 },
  { name: "Skinwalker", hp: 60, damage: 15 }
];
const bosses = [
  { name: "The Watcher", hp: 150, damage: 20 },
  { name: "The Nameless", hp: 220, damage: 30 },
  { name: "The Abyss", hp: 300, damage: 40 }
];

// Spell list
const allSpells = [
  { name: "Fireball", type: "attack", power: 30 },
  { name: "Lightning Strike", type: "attack", power: 45 },
  { name: "Heal", type: "heal", power: 50 }
];

// Character data
const charData = {
  "Spirit": { class: "Rogue", hp: 100, baseDamage: 15, secDamage: 25 },
  "Mantis": { class: "Mage", hp: 90, baseDamage: 10, secDamage: 30 },
  "Cacerv": { class: "Tank", hp: 150, baseDamage: 20, secDamage: 15 },
  "Enola": { class: "Butcher", hp: 110, baseDamage: 25, secDamage: 20 }
};

// --- Utility Functions ---
function $(id) { return document.getElementById(id); }
function log(text) {
  const logDiv = $('log');
  logDiv.innerHTML += text + "<br>";
  logDiv.scrollTop = logDiv.scrollHeight;
}
function updateStats() {
  if(player.name) {
    // Format items in inventory
    let itemsText = Object.entries(player.items)
      .filter(([item,qty]) => qty > 0)
      .map(([item,qty]) => item + " x" + qty)
      .join(", ");
    if(!itemsText) itemsText = "None";
    $('player-stats').innerHTML = 
      player.name + " (Level " + player.level + ") HP: " + player.hp + "/" + player.maxHP +
      " | Damage: " + player.baseDamage + " / " + player.secDamage + 
      " | Items: " + itemsText;
  }
  if(inCombat && enemy) {
    $('enemy-stats').innerText = enemy.name + " HP: " + enemy.hp;
  } else {
    $('enemy-stats').innerText = "";
  }
}

// Voice lines after defeating an enemy
function getVoiceLine(char, enemyName) {
  let line = "";
  if(char === "Spirit") {
    if(enemyName === "Ghost") line = "Spirit: Those lost souls stood no chance.";
    else if(enemyName === "Skinwalker") line = "Spirit: The skinwalker falls to my steel.";
    else line = "Spirit: Another one bites the dust.";
  } else if(char === "Mantis") {
    if(enemyName === "Ghost") line = "Mantis: I banished the spirits with my magic.";
    else if(enemyName === "Skinwalker") line = "Mantis: Your dark form is powerless against me.";
    else line = "Mantis: My spells grow stronger with each victory.";
  } else if(char === "Cacerv") {
    if(enemyName === "Ghost") line = "Cacerv: The ghost's wails shake the darkness!";
    else if(enemyName === "Skinwalker") line = "Cacerv: Even a skinwalker fears my might.";
    else line = "Cacerv: Another foe crushed underfoot.";
  } else if(char === "Enola") {
    if(enemyName === "Ghost") line = "Enola: Ghastly apparition... meet your end!";
    else if(enemyName === "Skinwalker") line = "Enola: The skinwalker bleeds... delicious!";
    else line = "Enola: The butcher's work never ends.";
  }
  return line;
}

// --- Audio ---
const music = document.getElementById('music');
const musicSource = document.getElementById('music-source');
function playMusic(track) {
  music.pause();
  musicSource.src = track;
  music.load();
  music.play();
}

// --- Game Initialization ---
$('start-button').onclick = function() {
  $('start-screen').classList.add('hidden');
  $('char-screen').classList.remove('hidden');
  // Prepare ambient music (will play on first user interaction)
  musicSource.src = "ambient.mp3";
  music.load();
  music.play();
};
const charButtons = document.querySelectorAll('.char-button');
charButtons.forEach(btn => {
  btn.onclick = function() {
    const c = this.getAttribute('data-char');
    initializePlayer(c);
    $('char-screen').classList.add('hidden');
    $('game-screen').classList.remove('hidden');
    $('explore-button').classList.remove('hidden');
    log("You are " + player.name + " the " + charData[player.name].class + "!");
    updateStats();
  };
});

// Set up player stats from chosen character
function initializePlayer(name) {
  character = name;
  player.name = name;
  player.maxHP = charData[name].hp;
  player.hp = player.maxHP;
  player.baseDamage = charData[name].baseDamage;
  player.secDamage = charData[name].secDamage;
  player.items = { "Medical Pack": 1, "Gluttony": 1, "Beer": 1, "Lightning Bug": 1, "Meat": 1, "Sticky Note": 1 };
  player.spells = [];
  player.level = 1;
  player.xp = 0;
}

// --- Exploration System ---
$('explore-button').onclick = function() {
  if(inCombat) return;
  // Determine boss spawn (only after clearing some rooms)
  if(bossCount < bosses.length) {
    bossChance += 0.05;
    if(Math.random() < bossChance && roomsCleared > 2) {
      startBossFight();
      return;
    }
  }
  // Determine room type randomly
  const roll = Math.random();
  let roomType = "";
  if(roll < 0.3) roomType = "Dungeon";
  else if(roll < 0.4) roomType = "Poolroom";
  else if(roll < 0.6) roomType = "Treasure";
  else if(roll < 0.9) roomType = "Empty";
  else roomType = "Dead End";

  log("You enter a new room: " + roomType);
  if(roomType === "Treasure") {
    giveRandomItem();
    enemyChance = Math.min(1, enemyChance + 0.05);
  } else if(roomType === "Poolroom") {
    // Only Ghost or Skinwalker
    if(Math.random() < enemyChance) {
      const e = ghostPool[Math.floor(Math.random() * ghostPool.length)];
      startCombat({ name: e.name, hp: e.hp, damage: e.damage });
      enemyChance = 0.2;
    } else {
      log("The pool room is eerily quiet.");
      enemyChance = Math.min(1, enemyChance + 0.05);
    }
  } else if(roomType === "Dungeon") {
    // Regular dungeon enemy
    if(Math.random() < enemyChance) {
      const e = enemies[Math.floor(Math.random() * enemies.length)];
      startCombat({ name: e.name, hp: e.hp, damage: e.damage });
      enemyChance = 0.2;
    } else {
      log("The dungeon room is empty.");
      enemyChance = Math.min(1, enemyChance + 0.05);
    }
  } else if(roomType === "Empty") {
    log("Nothing of interest here.");
    enemyChance = Math.min(1, enemyChance + 0.05);
  } else if(roomType === "Dead End") {
    log("Dead End. You find an old shrine and rest briefly.");
    healPlayer(10);
    enemyChance = Math.min(1, enemyChance + 0.05);
  }
  roomsCleared++;
  updateStats();
};

// Start a normal enemy combat
function startCombat(enemyObj) {
  inCombat = true;
  bossFight = false;
  enemy = { ...enemyObj };
  log("A wild " + enemy.name + " appears!");
  $('explore-button').classList.add('hidden');
  $('attack-button').classList.remove('hidden');
  $('use-item-button').classList.remove('hidden');
  if(player.spells.length > 0) $('use-spell-button').classList.remove('hidden');
  updateStats();
  playMusic("battle.mp3");
}

// Start a boss battle
function startBossFight() {
  inCombat = true;
  bossFight = true;
  const b = bosses[bossCount];
  enemy = { name: b.name, hp: b.hp, damage: b.damage };
  bossCount++;
  bossChance = 0;
  enemyChance = 0.2;
  log("Boss Encounter! " + enemy.name + " emerges!");
  $('explore-button').classList.add('hidden');
  $('attack-button').classList.remove('hidden');
  $('use-item-button').classList.remove('hidden');
  if(player.spells.length > 0) $('use-spell-button').classList.remove('hidden');
  updateStats();
  playMusic("boss.mp3");
}

// --- Combat System ---
// Attack button (click minigame)
$('attack-button').onclick = function() {
  $('attack-button').classList.add('hidden');
  $('use-item-button').classList.add('hidden');
  $('use-spell-button').classList.add('hidden');
  log("Attack now! Click " + player.baseDamage + " times in 4 seconds.");
  let clicks = 0;
  const clickBtn = document.createElement('button');
  clickBtn.innerText = "Click!";
  $('actions').appendChild(clickBtn);
  const timer = setTimeout(() => {
    clickBtn.disabled = true;
    $('actions').removeChild(clickBtn);
    let damage = Math.min(clicks, player.baseDamage);
    enemy.hp -= damage;
    log("You deal " + damage + " damage to " + enemy.name + ".");
    if(damage === 0) log("Your attack missed!");
    if(enemy.hp <= 0) {
      enemy.hp = 0;
      updateStats();
      log(enemy.name + " defeated!");
      afterBattle();
    } else {
      updateStats();
      setTimeout(enemyTurn, 1000);
    }
  }, 4000);
  clickBtn.onclick = function() {
    clicks++;
  };
};

// Enemy's turn with dodge mechanic
function enemyTurn() {
  // Check auto-dodge from Sticky Note
  if(window.autoDodge) {
    window.autoDodge = false;
    log("Your Sticky Note feathers distract the attack. Perfect dodge!");
    updateStats();
    // Return control to player
    $('attack-button').classList.remove('hidden');
    $('use-item-button').classList.remove('hidden');
    if(player.spells.length > 0) $('use-spell-button').classList.remove('hidden');
    return;
  }
  if(!enemy) return;
  log(enemy.name + " is attacking!");
  $('dodge-button').classList.remove('hidden');
  // Create timing bar for dodge
  const progressContainer = document.createElement('div');
  progressContainer.style.width = "200px";
  progressContainer.style.height = "10px";
  progressContainer.style.background = "#050";
  progressContainer.style.margin = "10px auto";
  progressContainer.id = "dodge-bar";
  document.getElementById('actions').appendChild(progressContainer);
  const indicator = document.createElement('div');
  indicator.style.width = "10px";
  indicator.style.height = "10px";
  indicator.style.background = "#0f0";
  indicator.style.position = "relative";
  progressContainer.appendChild(indicator);
  let pos = 0;
  let dir = 1;
  const interval = setInterval(() => {
    pos += dir;
    if(pos > 190) { pos = 190; dir = -1; }
    if(pos < 0) { pos = 0; dir = 1; }
    indicator.style.left = pos + "px";
  }, 10);
  let attempted = false;
  // After 4 seconds, if no dodge click, apply normal damage
  const dodgeTimeout = setTimeout(() => {
    if(!attempted) {
      attempted = true;
      clearInterval(interval);
      $('dodge-button').classList.add('hidden');
      progressContainer.remove();
      const dmg = enemy.damage;
      player.hp -= dmg;
      log("You failed to dodge. You take " + dmg + " damage.");
      if(player.hp <= 0) {
        player.hp = 0;
        log("You have been defeated!");
        endGame(false);
      } else {
        updateStats();
        $('attack-button').classList.remove('hidden');
        $('use-item-button').classList.remove('hidden');
        if(player.spells.length > 0) $('use-spell-button').classList.remove('hidden');
      }
    }
  }, 4000);

  $('dodge-button').onclick = function() {
    if(attempted) return;
    attempted = true;
    clearInterval(interval);
    clearTimeout(dodgeTimeout);
    $('dodge-button').classList.add('hidden');
    progressContainer.remove();
    let dmg = enemy.damage;
    if(Math.abs(pos - 100) < 10) {
      log("Perfect dodge! You take no damage.");
    } else {
      if(pos < 90 || pos > 110) {
        dmg *= 2;
        log("Failed dodge! You take double damage.");
      } else {
        log("Partial dodge! You take normal damage.");
      }
      player.hp -= dmg;
      log("You take " + dmg + " damage.");
    }
    if(player.hp <= 0) {
      player.hp = 0;
      log("You have been defeated!");
      endGame(false);
    } else {
      updateStats();
      $('attack-button').classList.remove('hidden');
      $('use-item-button').classList.remove('hidden');
      if(player.spells.length > 0) $('use-spell-button').classList.remove('hidden');
    }
  };
}

// --- Item and Spell System ---
// Use an item
$('use-item-button').onclick = function() {
  let itemNames = Object.keys(player.items).filter(it => player.items[it] > 0);
  if(itemNames.length === 0) {
    log("No items left!");
    return;
  }
  let item = prompt("Use which item? " + itemNames.join(", "));
  if(item && player.items[item] > 0) {
    useItem(item);
    updateStats();
    if(inCombat && enemy && enemy.hp > 0) {
      setTimeout(enemyTurn, 100);
    }
  } else {
    log("Invalid item.");
  }
};

// Use a spell
$('use-spell-button').onclick = function() {
  let spellNames = player.spells;
  let spell = prompt("Use which spell? " + spellNames.join(", "));
  if(spell && player.spells.includes(spell)) {
    useSpell(spell);
    updateStats();
    if(inCombat && enemy && enemy.hp > 0) {
      setTimeout(enemyTurn, 100);
    }
  } else {
    log("Invalid spell.");
  }
};

// Use item effects
function useItem(item) {
  if(player.items[item] <= 0) return;
  player.items[item]--;
  log("Used " + item + ".");
  if(item === "Medical Pack") {
    healPlayer(50);
  } else if(item === "Meat") {
    healPlayer(30);
  } else if(item === "Beer") {
    player.baseDamage += 5;
    player.secDamage += 5;
    log("Your strength increases permanently!");
  } else if(item === "Gluttony") {
    player.maxHP += 10;
    player.hp += 10;
    log("Your appetite gives you more vitality!");
  } else if(item === "Lightning Bug") {
    if(inCombat && enemy) {
      enemy.hp -= 30;
      log("Lightning Bug zaps the " + enemy.name + " for 30 damage!");
      if(enemy.hp <= 0) {
        enemy.hp = 0;
        log(enemy.name + " defeated!");
        afterBattle();
      }
    } else {
      log("Nothing to zap here.");
    }
  } else if(item === "Sticky Note") {
    log("You scribble notes for luck. Next dodge auto-succeeds.");
    window.autoDodge = true;
  }
}

// Use spell effects
function useSpell(spellName) {
  const spell = allSpells.find(s => s.name === spellName);
  if(!spell) return;
  if(spell.type === "attack") {
    enemy.hp -= spell.power;
    log("You cast " + spell.name + " for " + spell.power + " damage.");
    if(enemy.hp <= 0) {
      enemy.hp = 0;
      log(enemy.name + " defeated!");
      afterBattle();
    }
  } else if(spell.type === "heal") {
    healPlayer(spell.power);
    log("You cast " + spell.name + " and heal " + spell.power + " HP.");
  }
}

// Heal the player
function healPlayer(amount) {
  player.hp = Math.min(player.maxHP, player.hp + amount);
  log("Healed " + amount + " HP.");
}

// Grant a random item (treasure)
function giveRandomItem(forLevel = false) {
  const items = ["Medical Pack", "Gluttony", "Beer", "Lightning Bug", "Meat", "Sticky Note"];
  const item = items[Math.floor(Math.random() * items.length)];
  player.items[item] = (player.items[item] || 0) + 1;
  if(!forLevel) log("Found item: " + item);
  return item;
}

// --- After Battle and Leveling ---
function afterBattle() {
  inCombat = false;
  $('dodge-button').classList.add('hidden');
  $('attack-button').classList.add('hidden');
  $('use-item-button').classList.add('hidden');
  $('use-spell-button').classList.add('hidden');
  playMusic("ambient.mp3");
  // Voice line
  log(getVoiceLine(player.name, enemy.name));
  // Grant XP
  let xpGain = bossFight ? 100 : 20;
  player.xp += xpGain;
  log("You gained " + xpGain + " XP.");
  // Level up if threshold reached
  if(player.xp >= player.xpToLevel) {
    player.level++;
    player.xp -= player.xpToLevel;
    player.xpToLevel = Math.floor(player.xpToLevel * 1.5);
    player.hp = player.maxHP; // restore HP
    log("Leveled up to " + player.level + "! HP restored.");
    let choice = prompt("Choose upgrade: 1. +20 Max HP, 2. +5 Damage, 3. Random Treasure");
    if(choice == "1") {
      player.maxHP += 20;
      log("Max HP increased!");
    } else if(choice == "2") {
      player.baseDamage += 5;
      player.secDamage += 5;
      log("Damage increased!");
    } else if(choice == "3") {
      let item = giveRandomItem(true);
      log("You found a treasure: " + item);
    }
    updateStats();
  }
  // Unlock new spell after boss
  if(bossFight) {
    const newSpell = allSpells[bossCount-1];
    player.spells.push(newSpell.name);
    log("You learned a new spell: " + newSpell.name + "!");
  }
  // Check if final boss was defeated
  if(bossFight && bossCount >= bosses.length) {
    endGame(true);
    return;
  }
  enemy = null;
  $('explore-button').classList.remove('hidden');
  roomsCleared = 0;
  updateStats();
}

// --- End Game ---
function endGame(victory) {
  $('explore-button').disabled = true;
  $('attack-button').disabled = true;
  $('use-item-button').disabled = true;
  $('use-spell-button').disabled = true;
  if(victory) {
    log("Congratulations! You have triumphed!");
  } else {
    log("Game Over. You died.");
  }
}

</script>
</body>
</html>
