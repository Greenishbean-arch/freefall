<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FREEFALL — Full Playable</title>
<style>
/* Retro / horror style */
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{
  --bg:#060606; --panel:#0f0f0f; --accent:#ff3b3b; --muted:#888; --text:#eee;
}
html,body{height:100%;margin:0;background:linear-gradient(180deg,#030303,#0a0a0a);color:var(--text);font-family:'Press Start 2P',monospace;font-size:12px}
.wrap{max-width:920px;margin:10px auto;padding:12px}
h1{color:var(--accent);margin:0 0 8px 0}
.header{display:flex;justify-content:space-between;align-items:center}
#menu, #playArea{margin-top:8px}
button{background:var(--panel);border:2px solid #222;color:var(--text);padding:8px 10px;margin:4px;border-radius:2px;cursor:pointer}
button.full{width:100%}
.row{display:flex;gap:6px;flex-wrap:wrap}
.card{background:#0b0b0b;padding:8px;border:2px solid #151515}
#top{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#log{height:220px;overflow:auto;background:#050505;padding:10px;border:2px solid #111;white-space:pre-line}
.muted{color:var(--muted);font-size:10px}
.bar{height:14px;background:#222;border:2px solid #333;position:relative;margin:6px 0;overflow:hidden}
.marker{position:absolute;top:0;height:14px;background:var(--accent);width:4px;left:0}
.target{position:absolute;top:0;height:14px;background:rgba(255,59,59,0.22);border-left:1px solid rgba(255,59,59,0.4);border-right:1px solid rgba(255,59,59,0.4)}
.pill{background:#111;padding:4px 8px;border:1px solid #222;border-radius:999px}
.hidden{display:none}
.small{font-size:10px}
footer{margin-top:8px;font-size:10px;color:var(--muted)}
@media (max-width:520px){button{font-size:11px;padding:10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>FREEFALL</h1>
    <div class="muted small">Text RPG — Retro Horror</div>
  </div>

  <div id="menu">
    <button class="full" onclick="newGame()">New Game (wipe save)</button>
    <button class="full" onclick="openPlay()">Play / Continue</button>
  </div>

  <div id="playArea" class="hidden">
    <div id="top" aria-live="polite"></div>
    <div id="log"></div>
    <div id="ui" style="margin-top:8px"></div>
    <div class="muted small" style="margin-top:6px">Tip: Attack uses a click mini-game (4s). Dodge uses a timing bar. Using items counts as a turn.</div>
  </div>

  <footer>Auto-saved locally. Works on iPad/Safari. Bosses appear only late-game (after many rooms).</footer>
</div>

<script>
/* -----------------------------
   Game constants
   ----------------------------- */
const CHARACTERS = {
  Spirit: {name:"Spirit", hp:90, maxHp:90, primary: {name:"Knife", dmg:20}, secondary:{name:"Fists", dmg:10}, lines:{weak:"Too easy. Next time… try harder.",undead:"Killing the Killed… how… oddly satisfying.",boss:"You were defeated, by a mere mortal."}},
  Mantis: {name:"Mantis", hp:100, maxHp:100, primary:{name:"Magic Orb", dmg:15}, secondary:{name:"Kick", dmg:8}, lines:{weak:"My skill is unmatched! Heh.",undead:"The undead is re-dead… satisfying.",boss:"Nanana boo boo!"}},
  Cacerv: {name:"Cacerv", hp:125, maxHp:125, primary:{name:"Hammer", dmg:20}, secondary:{name:"Fists", dmg:5}, lines:{weak:"HAHA! Bye bye, Birdie.",undead:"Just like in the horror films! Except I don’t die.",boss:"слишком легко"}},
  Enola: {name:"Enola", hp:80, maxHp:80, primary:{name:"Machete", dmg:25}, secondary:{name:"Scissors", dmg:20}, lines:{weak:"I wonder how you would taste in a stew…",undead:"Can’t cook you... awww.",boss:"Hmmm… a Divine dish? Haha! What a wonderful idea!"}}
};

const ENEMIES = [
  {name:"Demon", hp:75, dmg:20, type:"weak"},
  {name:"Skinwalker", hp:100, dmg:15, type:"weak"},
  {name:"Ghost", hp:125, dmg:8, type:"undead"},
  {name:"Zombie", hp:50, dmg:30, type:"undead"},
  {name:"Goblin", hp:25, dmg:50, type:"weak"}
];

const BOSSES = [
  {name:"False Virtue", hp:900, dmg:25},
  {name:"Zombie King", hp:1000, dmg:30},
  {name:"Demon King", hp:1200, dmg:40},
  {name:"The Boogie Man", hp:1250, dmg:45},
  {name:"The Fallen Angel", hp:2500, dmg:60}
];

const ROOM_TYPES = ["Dungeon","Poolroom","Treasure room","Dead End","Empty Room"];

const ITEM_EFFECTS = {
  "Medical Pack": ()=>{ const heal=40; g.player.hp=Math.min(g.player.maxHp, g.player.hp+heal); return `Healed ${heal} HP.`; },
  "Gluttony": ()=>{ if(!g.enemy) return "No enemy."; g.enemy.hp-=20; return "Dealt 20 damage to the current enemy."; },
  "Beer": ()=>{ g.player.primaryBoost = (g.player.primaryBoost||0)+5; return "Damage increased by 5 (temporary)."; },
  "Lightning Bug": ()=>{ g.player.primaryBoost = (g.player.primaryBoost||0)+1; return "Damage increased by 1 (temporary)."; },
  "Meat": ()=>{ g.player.maxHp+=2; g.player.hp+=1; return "HP +1, max HP +2."; },
  "Sticky Note": ()=>{ if(!g.enemy) return "No enemy."; g.enemy.nextDamageReducer = (g.enemy.nextDamageReducer||0)+5; return "Enemy's next damage reduced by 5."; }
};
const ITEM_LIST = Object.keys(ITEM_EFFECTS);

/* -----------------------------
   Save / Game state
   ----------------------------- */
let g = loadSave();

function save(){
  try{ localStorage.setItem("freefall_full_v1", JSON.stringify(g)); }
  catch(e){ console.warn("Save failed", e); }
}
function loadSave(){
  try{
    const s = localStorage.getItem("freefall_full_v1");
    return s ? JSON.parse(s) : null;
  }catch(e){return null;}
}
function wipeSave(){ localStorage.removeItem("freefall_full_v1"); g = null; renderMenu(); }

/* -----------------------------
   UI helpers
   ----------------------------- */
const logEl = document.getElementById("log");
function log(t){ logEl.innerText += t + "\n"; logEl.scrollTop = logEl.scrollHeight; }
function clearLog(){ logEl.innerText = ""; }
function show(id){ document.getElementById(id).classList.remove("hidden"); }
function hide(id){ document.getElementById(id).classList.add("hidden"); }
function renderTop(){
  const top = document.getElementById("top");
  if(!g){ top.innerHTML = '<div class="card">No save loaded.</div>'; return; }
  const inv = g.items.length ? g.items.map(i=>`<span class="pill">${i}</span>`).join(" ") : '<span class="muted small">Empty</span>';
  const enemyHtml = g.enemy ? `<div class="card"><strong>Enemy</strong><div>${g.enemy.name} — HP ${Math.max(0,g.enemy.hp)}${g.enemy.isBoss?" (BOSS)":""}</div><div class="muted small">DMG: ${g.enemy.dmg}</div></div>` : "";
  top.innerHTML = `<div class="card"><strong>${g.char}</strong><div>HP ${Math.max(0,g.player.hp)}/${g.player.maxHp}</div><div class="muted small">Primary: ${g.player.primary.name} (${g.player.primary.dmg})</div></div>
  <div class="card"><strong>Room</strong><div>${g.currentRoom || "—"}</div><div class="muted small">Visited: ${g.roomsVisited}</div></div>
  <div class="card"><strong>Inventory</strong><div>${inv}</div></div>
  ${enemyHtml}`;
}
function renderUI(html){ document.getElementById("ui").innerHTML = html || ""; }

/* -----------------------------
   Startup / Menu
   ----------------------------- */
function renderMenu(){
  if(g){
    show('playArea');
    document.getElementById("menu").style.display = "block";
    renderTop();
    renderUI(`<button class="full" onclick="explore()">Explore</button>`);
    log("Save loaded. Press Explore to continue.");
  } else {
    hide('playArea');
    document.getElementById("menu").style.display = "block";
  }
}
function openPlay(){
  if(!g){
    // character choose
    renderCharacterChoice();
    log("Choose your character.");
    hide('menu');
    show('playArea');
  } else {
    hide('menu'); show('playArea'); renderTop(); renderUI(`<button class="full" onclick="explore()">Explore</button>`); log("Continuing your run...");
  }
}
function newGame(){
  if(confirm("Start a new run? This will wipe your current save.")){
    wipeSave();
    g=null;
    openPlay();
  }
}

/* -----------------------------
   Character selection
   ----------------------------- */
function renderCharacterChoice(){
  let html = '<div class="row">';
  for(const key in CHARACTERS){
    const c = CHARACTERS[key];
    html += `<button onclick="chooseChar('${key}')">${c.name} — HP ${c.hp} — ${c.primary.name} ${c.primary.dmg}</button>`;
  }
  html += '</div>';
  renderUI(html);
}
function chooseChar(key){
  const base = CHARACTERS[key];
  g = {
    char: key,
    player: {
      hp: base.hp,
      maxHp: base.maxHp,
      primary: {...base.primary},
      secondary: {...base.secondary},
      primaryBoost:0,
      lines: base.lines
    },
    level: 1,
    items: [],
    enemyChance: 20.0,      // starts at 20%
    bossChance: 0.0,        // builds slowly
    bossIndex: 0,
    battle: false,
    enemy: null,
    enemyQueue: null,       // for multi-enemy rooms
    currentRoom: null,
    roomsVisited: 0,
    progress: {},
    temp: {}
  };
  save();
  clearLog();
  log("You chose " + key + ". The descent begins...");
  renderTop();
  renderUI(`<button class="full" onclick="explore()">Begin</button>`);
}

/* -----------------------------
   Exploration & rooms behavior
   ----------------------------- */
function explore(){
  if(!g) return openPlay();
  g.roomsVisited++;
  const room = ROOM_TYPES[Math.floor(Math.random()*ROOM_TYPES.length)];
  g.currentRoom = room;
  renderTop();
  log(`You enter: ${room}`);
  // Boss logic: only allow bosses after 25 rooms visited (very late-game)
  if(g.roomsVisited >= 25){
    // bossChance increases on non-fight explores; allow roll
    if(Math.random()*100 < g.bossChance && g.bossIndex < BOSSES.length){
      startBoss();
      return;
    }
  }
  // Room-specific logic
  if(room === "Treasure room"){
    // guarantee a treasure, small chance of enemy
    const item = ITEM_LIST[Math.floor(Math.random()*ITEM_LIST.length)];
    g.items.push(item);
    log(`Treasure! You found: ${item}`);
    // small chance for an enemy (20%)
    if(Math.random()*100 < 20){
      const e = clone(randomEnemy());
      g.enemy = e; g.battle = true;
      log(`A guardian appears: ${e.name}`);
      // after fight, enemyChance resets per rules
      save(); battleMenu(); return;
    } else {
      // no enemy
      incrementChancesAfterExplore(false);
      renderUI(`<button class="full" onclick="explore()">Go Deeper</button>`);
      save(); return;
    }
  }
  // Poolroom -> Ghost or Skinwalker only
  let spawnRoll = Math.random()*100;
  let effectiveEnemyChance = g.enemyChance;
  if(room === "Empty Room") effectiveEnemyChance = Math.max(0, effectiveEnemyChance - 10);
  if(spawnRoll < effectiveEnemyChance){
    // spawn enemy(s) depending on room
    if(room === "Dungeon"){
      // Dungeon spawns 1-2 enemies (sequential)
      const count = Math.random() < 0.45 ? 2 : 1;
      let queue = [];
      for(let i=0;i<count;i++){
        queue.push(clone(randomEnemy()));
      }
      g.enemyQueue = queue;
      g.enemy = g.enemyQueue.shift();
      g.battle = true;
      log(`Dungeon enemy: ${g.enemy.name} (you will face ${count} total)`);
      g.enemyChance = 15; // reset after fight (per rules)
      g.bossChance += 1.5;
      save();
      battleMenu();
      return;
    } else if(room === "Poolroom"){
      const pool = ENEMIES.filter(e=>e.name==="Ghost"||e.name==="Skinwalker");
      const e = clone(pool[Math.floor(Math.random()*pool.length)]);
      g.enemy = e; g.battle = true; log(`From the shadows: ${e.name}`); g.enemyChance = 15; g.bossChance += 1.5; save(); battleMenu(); return;
    } else if(room === "Dead End"){
      // Dead End: 50% enemy, 30% trap(add damage), 20% nothing
      const r = Math.random()*100;
      if(r < 50){
        const e = clone(randomEnemy());
        g.enemy = e; g.battle = true; log(`A lurking ${e.name} blocks your way.`); g.enemyChance = 15; g.bossChance += 1.5; save(); battleMenu(); return;
      } else if(r < 80){
        // trap: lose small HP, counts as turn? it's environmental; just reduce HP
        const dmg = 8 + Math.floor(Math.random()*8);
        g.player.hp -= dmg; log(`A trap snaps! You take ${dmg} damage.`); if(g.player.hp <= 0){handleDeath();return;}
        incrementChancesAfterExplore(false); save(); renderUI(`<button class="full" onclick="explore()">Continue</button>`); return;
      } else {
        incrementChancesAfterExplore(false); save(); renderUI(`<button class="full" onclick="explore()">Continue</button>`); return;
      }
    } else {
      // Default spawn
      const e = clone(randomEnemy());
      g.enemy = e; g.battle = true; log(`${e.name} appears!`); g.enemyChance = 15; g.bossChance += 1.5; save(); battleMenu(); return;
    }
  } else {
    // no enemy
    incrementChancesAfterExplore(false);
    renderUI(`<button class="full" onclick="explore()">Go Deeper</button>`);
    save(); return;
  }
}
function incrementChancesAfterExplore(didFight){
  if(!didFight){
    g.enemyChance = Math.min(95, g.enemyChance + 5);
    g.bossChance = Math.min(100, g.bossChance + 1.5);
  }
}

/* -----------------------------
   Enemy utilities
   ----------------------------- */
function randomEnemy(){ return ENEMIES[Math.floor(Math.random()*ENEMIES.length)]; }
function clone(obj){ return JSON.parse(JSON.stringify(obj)); }

/* -----------------------------
   Boss spawn and flow
   ----------------------------- */
function startBoss(){
  const b = clone(BOSSES[g.bossIndex]);
  b.isBoss = true;
  g.enemy = b; g.battle = true; g.bossIndex++; g.bossChance = 0;
  log(`BOSS: ${b.name} appears!`);
  save();
  battleMenu();
}

/* -----------------------------
   Battle UI
   ----------------------------- */
function battleMenu(){
  renderTop();
  if(!g || !g.battle || !g.enemy){ renderUI(`<button class="full" onclick="explore()">Explore</button>`); return; }
  const html = `<div class="row">
    <button onclick="chooseAttack()">Attack</button>
    <button onclick="startDodge()">Dodge</button>
    <button onclick="openItemMenu()">Use Item</button>
    <button onclick="attemptFlee()">Search / Move (Try flee)</button>
  </div>
  <div class="muted small">Enemy HP: ${Math.max(0,g.enemy.hp)} — DMG: ${g.enemy.dmg}</div>`;
  renderUI(html);
}

/* -----------------------------
   Flee / Attempt Move (counts as turn)
   ----------------------------- */
function attemptFlee(){
  log("You try to move away/search (this counts as a turn)...");
  // small chance to escape without fight
  if(Math.random() < 0.25){
    log("You slip away successfully.");
    // remove enemy and reduce enemy chance slightly
    g.enemy = null; g.battle = false; g.enemyQueue = null;
    g.enemyChance = Math.max(15, g.enemyChance - 5);
    save();
    renderTop();
    renderUI(`<button class="full" onclick="explore()">Continue</button>`);
    return;
  } else {
    log("You couldn't escape; the enemy reacts.");
    save();
    // enemy gets a normal turn (so counts as both player's and enemy's turn)
    setTimeout(()=> enemyTurn(), 400);
  }
}

/* -----------------------------
   Attack flow (choice then click-minigame)
   ----------------------------- */
function chooseAttack(){
  if(!g || !g.enemy) return;
  const primary = g.player.primary; const secondary = g.player.secondary;
  renderUI(`<div class="row">
    <button onclick="startAttack('primary')">Primary: ${primary.name} (${primary.dmg})</button>
    <button onclick="startAttack('secondary')">Secondary: ${secondary.name} (${secondary.dmg})</button>
    <button onclick="battleMenu()">Back</button>
  </div>`);
}

function startAttack(which){
  if(!g || !g.enemy) return;
  const weapon = (which === 'primary') ? g.player.primary : g.player.secondary;
  const baseDmg = weapon.dmg + (g.player.primaryBoost||0);
  const needed = Math.max(1, Math.floor(baseDmg)); // clicks required for full damage
  const seconds = 4;
  log(`Click Attack ${needed} Amount of times in ${seconds} seconds.`);
  // render click button and counter
  renderUI(`<div class="muted small">Click as fast as you can:</div>
    <div style="margin:6px 0"><button id="clickBtn" class="full">CLICK</button></div>
    <div class="muted small">Clicks: <span id="clickCount">0</span> / ${needed}</div>`);
  let clicks = 0;
  const btn = document.getElementById("clickBtn");
  function onClick(){ if(clicks < needed) { clicks++; document.getElementById("clickCount").innerText = clicks; } }
  btn.addEventListener("click", onClick);
  // finish after seconds*1000
  setTimeout(()=>{
    btn.removeEventListener("click", onClick);
    const dealt = Math.min(clicks, needed);
    g.enemy.hp -= dealt;
    log(`You dealt ${dealt} damage (${weapon.name}).`);
    // using attack counts as player's turn (apply boosts? primaryBoost are temporary, let's keep them until changed)
    // clear any temporary boosts? (they can stack)
    // After player's action, check enemy death or enemy turn
    if(g.enemy.hp <= 0) {
      // enemy died
      save();
      setTimeout(()=> handleEnemyDeath(), 300);
    } else {
      save();
      setTimeout(()=> enemyTurn(), 350);
    }
  }, seconds * 1000);
}

/* -----------------------------
   Dodge timing mini-game
   ----------------------------- */
function startDodge(){
  if(!g || !g.enemy) return;
  // UI: show bar with random target zone
  const barWidth = Math.min(320, Math.max(240, Math.floor(window.innerWidth * 0.7)));
  const targetSize = Math.floor(Math.random() * 80) + 40; // width px
  const targetLeft = Math.floor(Math.random() * (barWidth - targetSize));
  // store state
  g.temp.dodge = {barWidth, targetSize, targetLeft, markerX:0, dir:1, speed:3, running:true};
  renderUI(`<div class="muted small">DODGE - Press Attempt Dodge when the red marker crosses the highlighted zone. Success: avoid next attack. Fail: double damage now.</div>
    <div class="bar" id="dodgeBar" style="width:${barWidth}px">
      <div class="target" id="dodgeTarget" style="left:${targetLeft}px;width:${targetSize}px"></div>
      <div class="marker" id="dodgeMarker" style="left:0px"></div>
    </div>
    <div class="row"><button onclick="attemptDodge()">Attempt Dodge</button><button onclick="cancelDodge()">Cancel</button></div>`);
  // animate marker
  g.temp.dodge.interval = setInterval(()=>{
    const d = g.temp.dodge;
    if(!d.running) return;
    d.markerX += d.dir * d.speed;
    if(d.markerX <= 0){ d.markerX = 0; d.dir = 1; }
    if(d.markerX >= d.barWidth - 4){ d.markerX = d.barWidth - 4; d.dir = -1; }
    const el = document.getElementById("dodgeMarker");
    if(el) el.style.left = d.markerX + "px";
  }, 16);
}
function cancelDodge(){
  if(g.temp.dodge && g.temp.dodge.interval) clearInterval(g.temp.dodge.interval);
  g.temp.dodge = null;
  log("You stop preparing to dodge.");
  battleMenu();
}
function attemptDodge(){
  if(!g.temp.dodge) return;
  const d = g.temp.dodge;
  d.running = false;
  clearInterval(d.interval);
  const markerCenter = d.markerX + 2;
  const targetLeft = d.targetLeft;
  const targetRight = d.targetLeft + d.targetSize;
  if(markerCenter >= targetLeft && markerCenter <= targetRight){
    log("DODGE SUCCESS! You evade the enemy's next attack (enemy's turn will be skipped).");
    g.temp.dodge = null;
    save();
    // Using dodge consumes player's turn but avoids the enemy attack — so call enemyTurn(skip=true)
    setTimeout(()=> enemyTurn(true), 250);
  } else {
    // fail = immediate double damage
    const damage = (g.enemy.nextDamageReducer ? Math.max(0, g.enemy.dmg - g.enemy.nextDamageReducer) : g.enemy.dmg) * 2;
    if(g.enemy.nextDamageReducer) delete g.enemy.nextDamageReducer;
    g.player.hp -= damage;
    log(`DODGE FAILED! You take ${damage} (double).`);
    g.temp.dodge = null;
    save();
    setTimeout(()=> checkAfterTurn(), 250);
  }
}

/* -----------------------------
   Items
   ----------------------------- */
function openItemMenu(){
  if(!g) return;
  if(g.items.length === 0){ log("No items."); battleMenu(); return; }
  let html = '<div class="row">';
  g.items.forEach((it, idx)=> html += `<button onclick="useItem(${idx})">${it}</button>`);
  html += '</div><div style="margin-top:6px"><button onclick="battleMenu()">Back</button></div>';
  renderUI(html);
}
function useItem(index){
  if(!g) return;
  const it = g.items.splice(index,1)[0];
  const res = ITEM_EFFECTS[it] ? ITEM_EFFECTS[it]() : "Used.";
  log(`Used ${it}. ${res}`);
  save();
  // using an item counts as player's turn
  setTimeout(()=> enemyTurn(), 350);
}

/* -----------------------------
   Enemy turn behavior
   ----------------------------- */
function enemyTurn(skip=false){
  if(!g || !g.enemy) { g.battle = false; battleMenu(); return; }
  if(g.enemy.hp <= 0){ setTimeout(()=> handleEnemyDeath(), 200); return; }
  // heal chance 30%
  if(!skip && Math.random() < 0.30){
    const heal = Math.floor(Math.random()*10)+1;
    g.enemy.hp += heal;
    log(`${g.enemy.name} heals +${heal} HP.`);
    save();
    setTimeout(()=> battleMenu(), 250);
    return;
  }
  if(skip){
    log(`${g.enemy.name} lunges but you evade.`);
    save();
    setTimeout(()=> battleMenu(), 250);
    return;
  }
  // normal attack
  let dmg = g.enemy.dmg;
  if(g.enemy.nextDamageReducer){ dmg = Math.max(0, dmg - g.enemy.nextDamageReducer); delete g.enemy.nextDamageReducer; }
  g.player.hp -= dmg;
  log(`${g.enemy.name} hits for ${dmg} damage.`);
  save();
  setTimeout(()=> checkAfterTurn(), 250);
}

/* -----------------------------
   Turn checks / death / victory
   ----------------------------- */
function checkAfterTurn(){
  if(g.player.hp <= 0){ handleDeath(); return; }
  if(g.enemy && g.enemy.hp <= 0){ handleEnemyDeath(); return; }
  // else player's turn
  battleMenu();
}
function handleDeath(){
  log("You were slain. The underworld swallows you.");
  // wipe save on death
  localStorage.removeItem("freefall_full_v1");
  g = null;
  renderTop();
  renderUI(`<button class="full" onclick="openPlay()">Return to Menu</button>`);
}
function handleEnemyDeath(){
  if(!g || !g.enemy) return;
  const slain = g.enemy.name;
  const wasBoss = g.enemy.isBoss;
  // voiceline
  const typ = wasBoss ? "boss" : (g.enemy.type || "weak");
  const line = (g.player.lines && g.player.lines[typ]) || (g.player.lines && g.player.lines.weak) || "";
  log(`${slain} defeated. ${line ? '"' + line + '"' : ''}`);
  // reward chance
  if(Math.random() < 0.25){
    const it = ITEM_LIST[Math.floor(Math.random()*ITEM_LIST.length)];
    g.items.push(it);
    log(`You found: ${it}`);
  }
  // clear enemy
  g.enemy = null;
  // if there was an enemyQueue (dungeon multi)
  if(g.enemyQueue && g.enemyQueue.length > 0){
    g.enemy = g.enemyQueue.shift();
    log(`Another enemy approaches: ${g.enemy.name}`);
    save();
    battleMenu();
    return;
  } else {
    // finished all in this room
    g.battle = false;
    g.enemyQueue = null;
    // boss resets bossChance and after boss fight enemyChance resets
    if(wasBoss){
      g.enemyChance = 15;
      g.bossChance = 0;
    } else {
      // small reduction after fight
      g.enemyChance = 15;
    }
    // Level up: slow progression but player levels on each kill
    g.level = (g.level || 1) + 1;
    save();
    renderTop();
    // show level up options
    renderLevelUp();
    return;
  }
}

/* -----------------------------
   Level up choices
   ----------------------------- */
function renderLevelUp(){
  renderUI(`<div class="muted small">Level Up! Choose one:</div>
    <div class="row">
      <button onclick="applyLevel('hp')">Increase Health +10</button>
      <button onclick="applyLevel('dmg')">Increase Base Damage +3</button>
      <button onclick="applyLevel('treasure')">Random Treasure</button>
    </div>`);
}
function applyLevel(choice){
  if(choice === 'hp'){ g.player.maxHp += 10; g.player.hp += 10; log("Max HP +10"); }
  else if(choice === 'dmg'){ g.player.primary.dmg += 3; g.player.secondary.dmg += 1; log("Damage increased."); }
  else { const it = ITEM_LIST[Math.floor(Math.random()*ITEM_LIST.length)]; g.items.push(it); log("You received: "+it); }
  // small increase to bossChance and enemyChance progression for pacing
  g.bossChance = Math.min(100, g.bossChance + 2.5);
  save();
  renderTop();
  renderUI(`<button class="full" onclick="explore()">Continue</button>`);
}

/* -----------------------------
   Utilities & helpers
   ----------------------------- */
function randomEnemy(){ return ENEMIES[Math.floor(Math.random()*ENEMIES.length)]; }

/* Expose menu functions globally for onclick attributes */
window.openPlay = openPlay;
window.newGame = newGame;
window.chooseChar = chooseChar;
window.explore = explore;
window.chooseAttack = chooseAttack;
window.startAttack = startAttack;
window.startDodge = startDodge;
window.cancelDodge = cancelDodge;
window.attemptDodge = attemptDodge;
window.openItemMenu = openItemMenu;
window.useItem = useItem;
window.attemptFlee = attemptFlee;
window.battleMenu = battleMenu;
window.wipeSave = wipeSave;

/* -----------------------------
   Boot sequence
   ----------------------------- */
(function init(){
  if(g){
    // ensure player structure updated if old save
    if(g.player && !g.player.primary) {
      const base = CHARACTERS[g.char];
      g.player.primary = {...base.primary};
      g.player.secondary = {...base.secondary};
    }
    show('playArea');
    document.getElementById("menu").style.display = "block";
    clearLog();
    log("Save loaded. Press Explore to continue.");
    renderTop();
    renderUI(`<button class="full" onclick="explore()">Explore</button>`);
  } else {
    document.getElementById("menu").style.display = "block";
    hide('playArea');
  }
})();
</script>
