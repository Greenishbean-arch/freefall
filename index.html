<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FREEFALL — Text RPG</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --green: #00ff66; --dark: #001a0a; --panel: #000; --muted:#0a0; }
  html,body { height:100%; margin:0; background:#000; color:var(--green); font-family:'Press Start 2P', monospace; font-size:13px; }
  .wrap { max-width:900px; margin:8px auto; padding:12px; text-align:center; }
  button { background:var(--panel); color:var(--green); border:2px solid var(--green); padding:10px; margin:6px; cursor:pointer; font-family:inherit; font-size:12px; }
  button:active { background:var(--green); color:#000; }
  .hidden { display:none; }
  #log { width:94%; max-width:820px; margin:8px auto; padding:10px; height:190px; overflow:auto; border:2px solid var(--green); background: #00160f; text-align:left; font-size:12px; }
  #topRow { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:6px; }
  .card { border:2px solid var(--green); padding:8px; min-width:160px; background:#00160f; }
  #enemyHPLine { margin-top:8px; font-size:12px; }
  .bar { width:90%; max-width:820px; height:18px; border:2px solid var(--green); margin:8px auto; position:relative; background:#00160f; }
  .target { position:absolute; top:0; height:100%; background:rgba(0,255,102,0.12); border-left:1px solid rgba(0,255,102,0.2); border-right:1px solid rgba(0,255,102,0.2); }
  .indicator { position:absolute; top:0; width:6px; height:100%; background:var(--green); left:0; }
  .small { font-size:11px; color:var(--green); }
  #bottomRow { margin-top:10px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .invList { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .pill { padding:6px 10px; border:1px solid var(--green); background:#000; }
</style>
</head>
<body>
<div class="wrap">
  <h1>FREEFALL</h1>

  <!-- MENU -->
  <div id="menu">
    <button id="playBtn">PLAY</button>
  </div>

  <!-- CHARACTER SELECT -->
  <div id="charSelect" class="hidden">
    <div class="card small">CHOOSE YOUR CHARACTER</div>
    <div id="charButtons" style="margin-top:8px;">
      <button class="charBtn" data-char="Spirit">SPIRIT — Rogue (90 HP) Knife 20 / Fists 10</button>
      <button class="charBtn" data-char="Mantis">MANTIS — Mage (100 HP) Orb 15 / Kick 8</button>
      <button class="charBtn" data-char="Cacerv">CACERV — Tank (125 HP) Hammer 20 / Fists 5</button>
      <button class="charBtn" data-char="Enola">ENOLA — Butcher (80 HP) Machete 25 / Scissors 20</button>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="topRow">
      <div id="playerCard" class="card">PLAYER</div>
      <div id="roomCard" class="card">ROOM</div>
      <div id="invCard" class="card">Inventory <div id="invSummary" class="small"></div></div>
    </div>

    <!-- ACTIONS -->
    <div id="actionRow" style="margin-bottom:6px;">
      <button id="exploreBtn">SEARCH / MOVE</button>
      <button id="inventoryBtn">INVENTORY</button>
      <button id="spellsBtn">SPELLS</button>
    </div>

    <!-- COMBAT AREA -->
    <div id="combatArea" class="hidden">
      <div style="margin-bottom:6px;">
        <button id="attackBtn">ATTACK</button>
        <button id="dodgeBtn">DODGE</button>
        <button id="useItemBtn">USE ITEM</button>
        <button id="useComboBtn">COMBOS</button>
      </div>

      <!-- Attack click area -->
      <div id="attackBox" class="hidden" style="margin:6px 0;">
        <div id="attackText" class="small"></div>
        <div style="margin-top:6px;">
          <button id="clickBtn">CLICK</button>
          <span id="clickCounter" class="small" style="margin-left:8px;">0</span>
        </div>
      </div>

      <!-- Dodge area -->
      <div id="dodgeBox" class="hidden" style="margin-top:6px;">
        <div class="small">DODGE - press DODGE NOW when the green marker hits the highlighted zone.</div>
        <div class="bar">
          <div id="targetZone" class="target"></div>
          <div id="indicator" class="indicator"></div>
        </div>
        <div style="margin-top:6px;">
          <button id="dodgeNowBtn">DODGE NOW</button>
        </div>
      </div>
    </div>

    <!-- Exploration Details -->
    <div id="exploreDetails" style="margin-top:8px;" class="small"></div>

    <!-- LOG / TERMINAL -->
    <div id="log"></div>

    <!-- Enemy HP Display (always under log during combat)-->
    <div id="enemyHPDisplay" class="small hidden" style="margin-top:6px;">
      <div id="enemyText"></div>
      <div id="enemyBar" class="bar" style="height:12px;">
        <div id="enemyFill" style="height:100%; background:rgba(0,255,102,0.6); width:0%"></div>
      </div>
    </div>

    <!-- Bottom row: inventory quick and level info -->
    <div id="bottomRow" class="small">
      <div id="levelInfo" class="card small">Level: <span id="levelNum">1</span> XP: <span id="xpNum">0</span></div>
      <div id="quickInv" class="card small">Quick Inventory: <div id="quickInvList" class="invList"></div></div>
    </div>
  </div>

  <!-- INVENTORY PANEL (modal-like) -->
  <div id="inventoryPanel" class="hidden" style="margin-top:8px;">
    <div class="card small">INVENTORY — Tap to use</div>
    <div id="inventoryList" style="margin-top:8px;"></div>
    <div style="margin-top:6px;">
      <button id="closeInvBtn">CLOSE</button>
    </div>
  </div>

  <!-- SPELLS PANEL -->
  <div id="spellsPanel" class="hidden" style="margin-top:8px;">
    <div class="card small">SPELLS — Permanent special saved across runs when final boss dies</div>
    <div id="spellsList" style="margin-top:8px;"></div>
    <div style="margin-top:6px;"><button id="closeSpellsBtn">CLOSE</button></div>
  </div>

  <!-- LEVEL-UP PANEL -->
  <div id="levelPanel" class="hidden" style="margin-top:8px;">
    <div class="card small">LEVEL UP — Choose one</div>
    <div style="margin-top:8px;">
      <button id="lvlHPBtn">Increase Max HP (+10)</button>
      <button id="lvlDmgBtn">Increase Damage (+3)</button>
      <button id="lvlTreasureBtn">Random Treasure</button>
    </div>
  </div>

</div>

<script>
/* =========================
   Data and initial state
   ========================= */

const PLAYER_TEMPLATES = {
  Spirit: { name:"Spirit", class:"Rogue", hp:90, maxHp:90, primaryName:"Knife", primaryDmg:20, altName:"Fists", altDmg:10 },
  Mantis: { name:"Mantis", class:"Mage", hp:100, maxHp:100, primaryName:"Magic Orb", primaryDmg:15, altName:"Kick", altDmg:8 },
  Cacerv: { name:"Cacerv", class:"Tank", hp:125, maxHp:125, primaryName:"Hammer", primaryDmg:20, altName:"Fists", altDmg:5 },
  Enola: { name:"Enola", class:"Butcher", hp:80, maxHp:80, primaryName:"Machete", primaryDmg:25, altName:"Scissors", altDmg:20 }
};

const ENEMIES = [
  { name:"Demon", hp:75, dmg:20, type:"demon" },
  { name:"Skinwalker", hp:100, dmg:15, type:"skinwalker" },
  { name:"Ghost", hp:125, dmg:8, type:"ghost" },
  { name:"Zombie", hp:50, dmg:30, type:"zombie" },
  { name:"Goblin", hp:25, dmg:28, type:"goblin" }
];

const BOSSES = [
  { name:"False Virtue", hp:900 },
  { name:"Zombie King", hp:1000 },
  { name:"Demon King", hp:1200 },
  { name:"The Boogie Man", hp:1250 },
  { name:"The Fallen Angel", hp:2500 }
];

// items: Meat, Lightning Bug, Sticky Note, Shell, Beer, Torch, Medical Pack
// Meat (+10 hp, +5 max), Lightning Bug (+1 permanent dmg), Sticky Note (skip enemy next turn), Shell (damage enemy / pond heal), Beer (+5 permanent dmg), Torch (reusable), Medical Pack (+40 hp)
const STARTING_ITEMS = {
  "Meat": 1,
  "Lightning Bug": 1,
  "Sticky Note": 1,
  "Shell": 1,
  "Beer": 1,
  "Torch": 1,
  "Medical Pack": 1
};

// spells per boss (per-run) and final permanent saved spell
const BOSS_SPELLS = [
  { name:"Smite", desc:"Deal 50 direct damage to an enemy." },
  { name:"Rot Nova", desc:"Deal 35 damage and reduce enemy damage next turn by 10." },
  { name:"Hellbrand", desc:"Deal 70 damage but take 10 recoil." },
  { name:"Fear Lock", desc:"Enemy loses next turn." },
  { name:"Divine Sever", desc:"Massive 200 damage (PERMANENT special, unlocked after final boss and stored across runs)." }
];

// game state for current run
let state = {
  player: null,
  items: {},       // counts, reset each run
  inventoryOpen: false,
  spells: [],      // spells unlocked this run (not permanent)
  permSpell: null, // permanent saved spell name (from localStorage)
  roomCount: 0,
  enemyChance: 20.0, // percent
  bossChance: 0.0,   // percent
  bossIndex: 0,
  inCombat: false,
  enemy: null,
  enemyQueue: null,
  enemySkipNext: false,
  tempDamageBoost: 0,
  tempDamageBoostTurns: 0,
  level: 1,
  xp: 0,
  xpToLevel: 100
};

// load permanent spell if saved
(function loadPermanentSpell(){
  try{
    const p = localStorage.getItem("freefall_perm_spell");
    if(p) state.permSpell = p;
  }catch(e){}
})();

/* =========================
   UI helpers
   ========================= */

const $ = id => document.getElementById(id);
const log = (t) => { const L=$('log'); L.innerHTML += t + "<br>"; L.scrollTop = L.scrollHeight; };
const updateHUD = () => {
  if(!state.player) return;
  $('playerCard').innerHTML = `<strong>${state.player.name}</strong><div class="small">${state.player.class}</div>
    <div class="small">HP: ${state.player.hp}/${state.player.maxHp}</div>
    <div class="small">Primary: ${state.player.primaryName} ${state.player.primaryDmg} | Alt: ${state.player.altName} ${state.player.altDmg}</div>`;
  $('roomCard').innerHTML = `<div class="small">Rooms: ${state.roomCount}</div>`;
  // inventory summary
  const invSummary = Object.entries(state.items).filter(([k,v])=>v>0).map(([k,v])=>`${k} x${v}`).join(" • ");
  $('invSummary').innerText = invSummary || "Empty";
  $('levelNum').innerText = state.level;
  $('xpNum').innerText = state.xp + "/" + state.xpToLevel;
  // quick inventory list
  const quick = $('quickInvList'); quick.innerHTML = "";
  Object.entries(state.items).forEach(([k,v])=>{
    if(v>0){
      const p = document.createElement('div'); p.className='pill'; p.innerText = `${k}(${v})`; quick.appendChild(p);
    }
  });
  // enemy hp display
  updateEnemyHPDisplay();
};

function showHUD(){ $('hud').classList.remove('hidden'); }
function hideHUD(){ $('hud').classList.add('hidden'); }

/* =========================
   Menu & character select
   ========================= */

$('playBtn').addEventListener('click', ()=>{
  $('menu').classList.add('hidden');
  $('charSelect').classList.remove('hidden');
});

document.querySelectorAll('.charBtn').forEach(btn=>{
  btn.addEventListener('click', ()=> {
    const ch = btn.dataset.char;
    startNewRun(ch);
  });
});

/* =========================
   Start / New Run
   ========================= */

function startNewRun(charKey){
  // reset run state (items not saved between runs)
  state.player = JSON.parse(JSON.stringify(PLAYER_TEMPLATES[charKey]));
  state.player.name = PLAYER_TEMPLATES[charKey].name;
  state.player.class = PLAYER_TEMPLATES[charKey].class;
  state.player.primaryName = PLAYER_TEMPLATES[charKey].primaryName;
  state.player.primaryDmg  = PLAYER_TEMPLATES[charKey].primaryDmg;
  state.player.altName = PLAYER_TEMPLATES[charKey].altName;
  state.player.altDmg = PLAYER_TEMPLATES[charKey].altDmg;
  // Normalize naming compatibility (some templates used different keys)
  state.player.primaryName = PLAYER_TEMPLATES[charKey].primaryName || PLAYER_TEMPLATES[charKey].primaryName;
  state.player.primaryDmg = PLAYER_TEMPLATES[charKey].primaryDmg || PLAYER_TEMPLATES[charKey].primaryDmg;
  // items
  state.items = JSON.parse(JSON.stringify(STARTING_ITEMS));
  // other
  state.spells = []; // per-run spells
  state.roomCount = 0;
  state.enemyChance = 20.0;
  state.bossChance = 0.0;
  state.bossIndex = 0;
  state.inCombat = false;
  state.enemy = null;
  state.enemyQueue = null;
  state.enemySkipNext = false;
  state.tempDamageBoost = 0;
  state.tempDamageBoostTurns = 0;
  state.level = 1;
  state.xp = 0;
  state.xpToLevel = 100;

  // UI
  $('charSelect').classList.add('hidden');
  $('hud').classList.remove('hidden');
  $('inventoryPanel').classList.add('hidden');
  $('spellsPanel').classList.add('hidden');
  $('levelPanel').classList.add('hidden');
  $('combatArea').classList.add('hidden');
  $('attackBox').classList.add('hidden');
  $('dodgeBox').classList.add('hidden');
  $('enemyHPDisplay').classList.add('hidden');
  $('exploreDetails').innerText = "";
  log("Once, long ago, a group of humans got sucked down a hole and dropped into the underworld. Upon entering, they are filled with unbridled rage.");
  log("Choose your actions carefully. Save the permanent power for the final moment.");
  updateHUD();
}

/* =========================
   Exploration & rooms
   ========================= */

$('exploreBtn').addEventListener('click', explore);

function explore(){
  if(state.inCombat){ log("You're in combat — cannot explore."); return; }
  state.roomCount++;
  state.enemyChance = Math.min(95, state.enemyChance); // cap
  // boss chance increases by 1.5 each room
  state.bossChance = Math.min(100, state.bossChance + 1.5);

  // pick room type
  const roll = Math.random();
  let roomType = "";
  if(roll < 0.30) roomType = "Dungeon";
  else if(roll < 0.45) roomType = "Poolroom";
  else if(roll < 0.60) roomType = "Treasure room";
  else if(roll < 0.80) roomType = "Empty Room";
  else roomType = "Dead End";

  $('exploreDetails').innerText = `You enter a ${roomType}.`;
  log(`You move forward into a ${roomType}.`);

  // Boss eligibility only after 25 rooms visited (very late game)
  const bossEligible = state.roomCount >= 25;

  // If bossEligible and bossChance roll succeeds, spawn boss (in order)
  if(bossEligible && Math.random()*100 < state.bossChance && state.bossIndex < BOSSES.length) {
    spawnBoss();
    return;
  }

  // handle room types
  if(roomType === "Dungeon") {
    // 1-2 enemies, sequential
    const count = Math.random() < 0.45 ? 2 : 1;
    const queue = [];
    for(let i=0;i<count;i++){
      queue.push(cloneRandomEnemy());
    }
    state.enemyQueue = queue;
    state.enemy = state.enemyQueue.shift();
    log(`A Dungeon blocks you. You will face ${count} enemy(ies). First: ${state.enemy.name}`);
    startCombat();
    // reset enemy chance after fight will be applied in afterBattle
    return;
  }

  if(roomType === "Poolroom") {
    // Only Ghost or Skinwalker
    if(Math.random()*100 < state.enemyChance) {
      const pool = ENEMIES.filter(e=>e.name==="Ghost"||e.name==="Skinwalker");
      state.enemy = clone(pool[Math.floor(Math.random()*pool.length)]);
      log(`The water ripples... a ${state.enemy.name} emerges.`);
      startCombat();
      return;
    } else {
      // no enemy
      log("The pool sits still, moonlight cold.");
      state.enemyChance += 5;
      updateHUD();
      return;
    }
  }

  if(roomType === "Treasure room") {
    // grant one random treasure
    const it = randomItem();
    state.items[it] = (state.items[it] || 0) + 1;
    log(`You found a treasure: ${it}.`);
    state.enemyChance += 5;
    updateHUD();
    return;
  }

  if(roomType === "Dead End") {
    // nothing
    log("A dead end. You rest and collect your thoughts.");
    // maybe small heal
    const healAmt = Math.min(10, state.player.maxHp - state.player.hp);
    if(healAmt>0){
      state.player.hp += healAmt;
      log(`You feel a little better (+${healAmt} HP).`);
    }
    state.enemyChance += 5;
    updateHUD();
    return;
  }

  if(roomType === "Empty Room") {
    // 50% chance of variation
    if(Math.random() < 0.5) {
      const opt = Math.random();
      if(opt < 0.33) {
        // Pond
        log("You find a small pond, its water shimmering.");
        // present action options: Use Shell to attract healing fish (+10 HP) or leave
        showExploreOptionsForPond();
        return;
      } else if(opt < 0.66) {
        // Dark Room
        log("A dark room yawns ahead — you cannot see the path.");
        showExploreOptionsForDark();
        return;
      } else {
        // Healing Shrine
        log("A quiet shrine stands in the center, ancient and warm.");
        // heal +15
        const healAmt = Math.min(15, state.player.maxHp - state.player.hp);
        state.player.hp += healAmt;
        log(`The shrine's blessing heals you for ${healAmt} HP.`);
        state.enemyChance += 5;
        updateHUD();
        return;
      }
    } else {
      log("An empty, echoing room. Nothing of interest.");
      state.enemyChance += 5;
      updateHUD();
      return;
    }
  }
}

/* Pond actions (button feedback, no typing) */
function showExploreOptionsForPond(){
  $('exploreDetails').innerHTML = '<div class="small">Pond: Use Shell to attract healing fish (+10 HP) or leave.</div>' +
    '<div style="margin-top:8px;"><button id="pondShellBtn">USE SHELL</button> <button id="pondLeaveBtn">LEAVE</button></div>';
  $('pondShellBtn').addEventListener('click', ()=>{
    if((state.items["Shell"]||0) > 0) {
      state.items["Shell"]--;
      const heal = Math.min(10, state.player.maxHp - state.player.hp);
      state.player.hp += heal;
      log("You chip a shell in the pond; fish are attracted — you regain "+heal+" HP.");
      $('exploreDetails').innerHTML = "";
      state.enemyChance += 5;
      updateHUD();
    } else {
      log("You have no shell to use.");
    }
  }, { once:true });
  $('pondLeaveBtn').addEventListener('click', ()=>{
    $('exploreDetails').innerHTML = "";
    state.enemyChance += 5;
  }, { once:true });
}

/* Dark room actions — requires torch to proceed (torch is reusable) */
function showExploreOptionsForDark(){
  $('exploreDetails').innerHTML = '<div class="small">Dark Room: It is pitch black. Use Torch to light your way.</div>' +
    '<div style="margin-top:8px;"><button id="useTorchBtn">USE TORCH</button> <button id="leaveDarkBtn">LEAVE</button></div>';
  $('useTorchBtn').addEventListener('click', ()=>{
    if((state.items["Torch"]||0) > 0) {
      // Torch is reusable — do not decrement
      log("You light your torch. The room reveals a narrow path forward.");
      // small chance of event or small loot
      if(Math.random() < 0.25){
        const it = randomItem();
        state.items[it] = (state.items[it]||0)+1;
        log("You spotted something in the light: "+it);
      } else {
        log("The torch reveals nothing but carved stones.");
      }
      $('exploreDetails').innerHTML = "";
      state.enemyChance += 5;
      updateHUD();
    } else {
      log("You have no torch.");
    }
  }, { once:true });
  $('leaveDarkBtn').addEventListener('click', ()=>{
    $('exploreDetails').innerHTML = "";
    state.enemyChance += 5;
  }, { once:true });
}

/* =========================
   Spawn helpers
   ========================= */

function randomItem(){
  const list = ["Meat","Lightning Bug","Sticky Note","Shell","Beer","Medical Pack"];
  return list[Math.floor(Math.random()*list.length)];
}

function cloneRandomEnemy(){
  const e = ENEMIES[Math.floor(Math.random()*ENEMIES.length)];
  return JSON.parse(JSON.stringify(e));
}

/* =========================
   Combat system
   ========================= */

function startCombat(){
  state.inCombat = true;
  $('combatArea').classList.remove('hidden');
  $('exploreDetails').innerHTML = "";
  $('enemyHPDisplay').classList.remove('hidden');
  updateEnemyHPDisplay();
  updateHUD();
}

function endCombat(){
  state.inCombat = false;
  $('combatArea').classList.add('hidden');
  $('attackBox').classList.add('hidden');
  $('dodgeBox').classList.add('hidden');
  $('enemyHPDisplay').classList.add('hidden');
  $('exploreDetails').innerHTML = "";
  state.enemy = null;
  state.enemyQueue = null;
  // reset temporary boost
  state.tempDamageBoost = 0;
  state.tempDamageBoostTurns = 0;
  updateHUD();
}

/* Attack Click Mini-game */
$('attackBtn').addEventListener('click', startAttack);

let attackStartTime = 0;
function startAttack(){
  if(!state.enemy) { log("No enemy to attack."); return; }
  // determine click limit using primary damage + permanent boosts (LightBug and Beer apply as permanent to primaryDmg)
  const baseDmg = state.player.primaryDmg + (state.items["Lightning Bug"] ? 0 : 0); // permanent handled via items applying to primaryDmg directly when used
  const limit = state.player.primaryDmg + (state.items["Lightning Bug"] ? 0 : 0); // we'll use player.primaryDmg updated by item use
  // But simpler: we track damage directly in player.primaryDmg and player.altDmg for permanent boosts.
  const clickGoal = state.player.primaryDmg + state.tempDamageBoost;
  state.clickTarget = Math.max(1, clickGoal);
  state.clicks = 0;
  $('attackText').innerText = `Click Attack ${state.clickTarget} Amount of times in 4 seconds.`;
  $('clickCounter').innerText = '0';
  $('attackBox').classList.remove('hidden');
  attackStartTime = 0;
  // enable click button
  $('clickBtn').disabled = false;
  // after 4s, resolve
  setTimeout(resolveAttack, 4000);
}

$('clickBtn').addEventListener('click', ()=>{
  if(typeof state.clicks === 'undefined') return;
  if(state.clicks === 0) attackStartTime = Date.now();
  state.clicks++;
  $('clickCounter').innerText = state.clicks;
  // do not allow clicks beyond target—still count but capped later
});

/* Resolve attack */
function resolveAttack(){
  $('attackBox').classList.add('hidden');
  const target = state.clickTarget || 1;
  const clicks = state.clicks || 0;
  const damage = Math.min(clicks, target);
  // check crit: if player reached target within 2s (2000ms), grant crit chance
  let crit = false;
  if(clicks >= target && attackStartTime > 0){
    const time = Date.now() - attackStartTime;
    if(time <= 2000){
      // 40% crit chance
      if(Math.random() < 0.40) { crit = true; }
    }
  }
  let finalDamage = damage;
  if(crit) {
    const bonus = Math.ceil(target * 0.5);
    finalDamage += bonus;
    log("Critical hit! +" + bonus + " damage.");
  }
  // also include temporary single-turn boosts (from Beer+Lightning bug combo)
  if(state.tempDamageBoost && state.tempDamageBoostTurns > 0){
    finalDamage += state.tempDamageBoost;
    // reduce counter
    state.tempDamageBoostTurns--;
    if(state.tempDamageBoostTurns <= 0) state.tempDamageBoost = 0;
  }
  state.enemy.hp -= finalDamage;
  log(`You strike for ${finalDamage} damage.`);
  updateEnemyHPDisplay();
  // check enemy death
  if(state.enemy.hp <= 0){
    state.enemy.hp = 0;
    afterEnemyDefeated();
  } else {
    // enemy turn (unless enemy skip set by sticky note or other effect)
    setTimeout(enemyTurn, 600);
  }
}

/* DODGE */
$('dodgeBtn').addEventListener('click', startDodge);
let dodgeInterval = null, dodgePos = 0, dodgeDir = 1;
function startDodge(){
  if(!state.enemy){ log("No incoming attack."); return; }
  $('dodgeBox').classList.remove('hidden');
  // randomize target zone size/position for fairness
  const zoneWidthPercent = 12 + Math.floor(Math.random()*10); // 12-22%
  const zoneLeftPercent = 30 + Math.floor(Math.random()*30); // 30-60%
  $('targetZone').style.left = zoneLeftPercent + '%';
  $('targetZone').style.width = zoneWidthPercent + '%';
  dodgePos = 0; dodgeDir = 1;
  // speed scales slightly with rooms (but not impossible)
  const speed = 3 + Math.min(6, Math.floor(state.roomCount / 10));
  dodgeInterval = setInterval(()=>{
    dodgePos += dodgeDir * speed;
    if(dodgePos > 100 - 2) dodgeDir = -1;
    if(dodgePos < 0) dodgeDir = 1;
    $('indicator').style.left = dodgePos + '%';
  }, 20);
}

/* Player presses Dodge Now */
$('dodgeNowBtn').addEventListener('click', ()=>{
  if(!state.enemy) return;
  clearInterval(dodgeInterval);
  $('dodgeBox').classList.add('hidden');
  const zoneLeft = parseFloat($('targetZone').style.left);
  const zoneWidth = parseFloat($('targetZone').style.width);
  const zoneRight = zoneLeft + zoneWidth;
  const marker = dodgePos;
  // success if marker inside zone
  if(marker >= zoneLeft && marker <= zoneRight){
    log("Perfect dodge! You avoid the attack.");
    // Dodge consumes player's turn but enemy misses — enemy's turn is skipped
    // After dodge, return to player action (i.e., nothing else)
    state.enemySkipNext = false;
    // after a dodge success, player's turn ends; so nothing else — ready to act again
  } else {
    // failed dodge — double damage and counts as turn
    const dmg = (state.enemy.dmg || 10) * 2;
    state.player.hp -= dmg;
    log(`Failed dodge! You take ${dmg} damage.`);
    updateHUD();
    if(state.player.hp <= 0){
      playerDied();
      return;
    }
  }
  // After dodge resolution, enemy still may act unless skip was triggered (but per rules: dodge success avoids enemy turn)
  // In success case, do not call enemyTurn. In fail case, we've already applied damage (counts as both player's and enemy's turn)
});

/* Enemy turn behavior */
function enemyTurn(){
  if(!state.enemy) return;
  // if enemy skip flag is active (from Sticky Note or Fear Lock), skip and clear
  if(state.enemySkipNext){
    log(`${state.enemy.name} is stunned and misses its turn.`);
    state.enemySkipNext = false;
    // proceed back to player
    return;
  }
  // enemy can heal themselves sometimes (max +10)
  if(Math.random() < 0.25){
    const healAmt = 1 + Math.floor(Math.random()*10); // 1-10
    state.enemy.hp += healAmt;
    log(`${state.enemy.name} heals for ${healAmt} HP.`);
    updateEnemyHPDisplay();
    return;
  }
  // Normal attack
  const dmg = state.enemy.dmg || 10;
  state.player.hp -= dmg;
  log(`${state.enemy.name} hits you for ${dmg} damage.`);
  updateHUD();
  if(state.player.hp <= 0) playerDied();
}

/* After enemy defeated handling */
function afterEnemyDefeated(){
  // voice lines per character + enemy type
  const enemyType = state.enemy ? state.enemy.type : "unknown";
  const char = state.player.name;
  let voiceline = "";
  if(char === "Spirit"){
    if(enemyType==="zombie"||enemyType==="ghost") voiceline = "Killing the Killed… how… oddly satisfying.";
    else voiceline = "Too easy. Next time… try harder.";
  } else if(char === "Mantis"){
    if(enemyType==="zombie"||enemyType==="ghost") voiceline = "The undead is re-dead… satisfying.";
    else voiceline = "My skill is unmatched! Heh.";
  } else if(char === "Cacerv"){
    if(enemyType==="zombie"||enemyType==="ghost") voiceline = "Just like in the horror films! Except I don’t die.";
    else voiceline = "HAHA! Bye bye, Birdie.";
  } else if(char === "Enola"){
    if(enemyType==="zombie"||enemyType==="ghost") voiceline = "Can’t cook you... awww.";
    else voiceline = "I wonder how you would taste in a stew…";
  }
  if(state.enemy && state.enemy.boss){
    // boss kill line overrides
    if(char === "Spirit") voiceline = "You were defeated, by a mere mortal.";
    else if(char === "Mantis") voiceline = "Nanana boo boo!";
    else if(char === "Cacerv") voiceline = "слишком легко";
    else if(char === "Enola") voiceline = "Hmmm… a Divine dish? Haha! What a wonderful idea!";
  }
  if(voiceline) log(voiceline);

  // grant XP
  const xpGain = state.enemy && state.enemy.boss ? 200 : 40;
  state.xp += xpGain;
  log(`You gained ${xpGain} XP.`);
  updateHUD();

  // per boss spells: give appropriate spell for that boss index
  if(state.enemy && state.enemy.boss){
    const idx = state.bossIndex - 1; // bossIndex incremented when spawnBoss ran
    const spell = BOSS_SPELLS[idx];
    if(spell){
      // if this is the final boss (index last), grant permanent spell in storage
      if(idx === BOSS_SPELLS.length - 1){
        // final boss -> grant permanent special spell
        const permName = spell.name;
        state.permSpell = permName;
        try { localStorage.setItem("freefall_perm_spell", permName); } catch(e){}
        log(`You have unlocked a permanent power: ${permName} (will persist across runs).`);
      } else {
        state.spells.push(spell.name);
        log(`You learned a new spell: ${spell.name}.`);
      }
    }
  }

  // after kill, maybe drop an item (25% chance)
  if(Math.random() < 0.25){
    const it = randomItem();
    state.items[it] = (state.items[it] || 0) + 1;
    log(`The enemy dropped: ${it}`);
  }

  // reset enemy queue or end combat
  if(state.enemyQueue && state.enemyQueue.length > 0){
    state.enemy = state.enemyQueue.shift();
    log(`Another enemy approaches: ${state.enemy.name}`);
    updateEnemyHPDisplay();
  } else {
    // end combat
    state.enemy = null;
    state.inCombat = false;
    $('combatArea').classList.add('hidden');
    $('enemyHPDisplay').classList.add('hidden');
    $('exploreDetails').innerText = "";
    // reset enemyChance to 15% after any fight (per rules)
    state.enemyChance = 15.0;
    updateHUD();
    // check level up
    checkLevelUp();
  }
}

/* Level up handling */
function checkLevelUp(){
  if(state.xp >= state.xpToLevel){
    state.level += 1;
    state.xp -= state.xpToLevel;
    state.xpToLevel = Math.floor(state.xpToLevel * 1.35);
    // restore to full hp
    state.player.hp = state.player.maxHp;
    log(`LEVEL UP! You are now level ${state.level}. HP restored to max.`);
    // show choices
    $('levelPanel').classList.remove('hidden');
  }
}

$('lvlHPBtn').addEventListener('click', ()=>{
  state.player.maxHp += 10;
  state.player.hp = state.player.maxHp;
  $('levelPanel').classList.add('hidden');
  log("Max HP increased by 10. HP restored.");
  updateHUD();
});
$('lvlDmgBtn').addEventListener('click', ()=>{
  state.player.primaryDmg += 3; // apply to primary damage
  $('levelPanel').classList.add('hidden');
  log("Damage increased by 3.");
  updateHUD();
});
$('lvlTreasureBtn').addEventListener('click', ()=>{
  const it = randomItem();
  state.items[it] = (state.items[it]||0)+1;
  $('levelPanel').classList.add('hidden');
  log("You received a treasure: " + it);
  updateHUD();
});

/* =========================
   Inventory UI & item usage
   ========================= */

$('inventoryBtn').addEventListener('click', openInventory);
$('closeInvBtn').addEventListener('click', ()=>{ $('inventoryPanel').classList.add('hidden'); });

function openInventory(){
  // build inventory UI with buttons (no prompts)
  $('inventoryList').innerHTML = "";
  const div = $('inventoryList');
  Object.keys(state.items).forEach(key=>{
    const count = state.items[key] || 0;
    const row = document.createElement('div'); row.style.margin = "6px";
    const label = document.createElement('span'); label.innerText = `${key} x${count}`; label.className='small';
    row.appendChild(label);
    const useBtn = document.createElement('button'); useBtn.innerText = "USE";
    useBtn.disabled = (count <= 0 && key !== "Torch"); // Torch is reusable; but if you start with none, it's disabled
    useBtn.addEventListener('click', ()=>{
      useItem(key);
      openInventory(); // refresh
    });
    row.appendChild(useBtn);
    div.appendChild(row);
  });
  // combo button if both present
  const comboRow = document.createElement('div'); comboRow.style.margin="8px";
  const comboBtn = document.createElement('button');
  comboBtn.innerText = "COMBINE: Beer + Lightning Bug -> +10 damage next attack";
  comboBtn.disabled = !((state.items["Beer"]||0) > 0 && (state.items["Lightning Bug"]||0) > 0);
  comboBtn.addEventListener('click', ()=>{
    // consume both and set temp boost for next attack
    state.items["Beer"]--; state.items["Lightning Bug"]--;
    state.tempDamageBoost = 10;
    state.tempDamageBoostTurns = 1;
    log("You combine Beer + Lightning Bug: +10 damage for your next attack.");
    openInventory();
  });
  comboRow.appendChild(comboBtn);
  div.appendChild(comboRow);
  // show permanent spell if exists
  const permRow = document.createElement('div'); permRow.style.marginTop="8px";
  permRow.innerHTML = `<div class="small">Permanent Spell (saved): ${state.permSpell || "NONE"}</div>`;
  div.appendChild(permRow);
  $('inventoryPanel').classList.remove('hidden');
}

/* Use item function (button-driven) */
function useItem(itemName){
  // Torch is reusable — do not decrement
  if(itemName === "Torch"){
    if((state.items["Torch"]||0) <= 0){ log("You have no Torch."); return;}
    log("You use the Torch (reusable). It lights your surroundings.");
    // Torch use effect depends on context: if in a Dark Room explore view, it will be used there; if in combat, could be used for minor effect (we'll make it light and reveal, no combat effect)
    return;
  }

  if((state.items[itemName] || 0) <= 0){ log("No " + itemName + " left."); return; }

  // Using item in combat consumes player turn; in exploration it's immediate and doesn't cause enemy turn.
  const inCombatNow = state.enemy !== null;

  // Meat
  if(itemName === "Meat"){
    state.items["Meat"]--;
    state.player.maxHp += 5;
    state.player.hp = Math.min(state.player.maxHp, state.player.hp + 10);
    log("You eat Meat: +10 HP and +5 max HP.");
    if(inCombatNow) setTimeout(enemyTurn, 300);
    updateHUD();
    return;
  }

  // Lightning Bug -> +1 permanent damage
  if(itemName === "Lightning Bug"){
    state.items["Lightning Bug"]--;
    state.player.primaryDmg += 1;
    log("You release a Lightning Bug: permanent +1 damage to primary attacks.");
    if(inCombatNow) setTimeout(enemyTurn, 300);
    updateHUD();
    return;
  }

  // Sticky Note -> skip enemy next turn
  if(itemName === "Sticky Note"){
    state.items["Sticky Note"]--;
    if(inCombatNow) {
      state.enemySkipNext = true;
      log("You slap a Sticky Note with a glyph — the enemy's next turn will be skipped.");
      // Using an item counts as turn; enemy will be skipped on their turn
      setTimeout(()=>{ /* nothing here; enemyTurn checks skip flag */ }, 200);
    } else {
      log("You leave a Sticky Note. It hums faintly.");
    }
    updateHUD();
    return;
  }

  // Shell -> in combat, deal damage; in pond used to heal (handled in pond)
  if(itemName === "Shell"){
    state.items["Shell"]--;
    if(inCombatNow){
      const dmg = 20;
      state.enemy.hp -= dmg;
      log(`You fling a shell at ${state.enemy.name} for ${dmg} damage.`);
      updateEnemyHPDisplay();
      if(state.enemy.hp <= 0) afterEnemyDefeated();
      else setTimeout(enemyTurn, 300);
    } else {
      log("Shell used — nothing obvious happened.");
    }
    updateHUD();
    return;
  }

  // Beer -> permanent +5 damage
  if(itemName === "Beer"){
    state.items["Beer"]--;
    state.player.primaryDmg += 5;
    log("You drink Beer. Your strikes feel stronger (+5 primary damage).");
    if(inCombatNow) setTimeout(enemyTurn, 300);
    updateHUD();
    return;
  }

  // Medical Pack -> +40 HP
  if(itemName === "Medical Pack"){
    state.items["Medical Pack"]--;
    const heal = Math.min(40, state.player.maxHp - state.player.hp);
    state.player.hp += heal;
    log("You use Medical Pack: +" + heal + " HP.");
    if(inCombatNow) setTimeout(enemyTurn, 300);
    updateHUD();
    return;
  }

  log("This item cannot be used right now.");
}

/* Use combo button in combat (duplicate entry) */
$('useComboBtn').addEventListener('click', ()=>{
  if((state.items["Beer"]||0) > 0 && (state.items["Lightning Bug"]||0) > 0){
    state.items["Beer"]--; state.items["Lightning Bug"]--;
    state.tempDamageBoost = 10;
    state.tempDamageBoostTurns = 1;
    log("You combine Beer + Lightning Bug for +10 damage on your next attack.");
    // using consumes player's turn; enemy acts
    setTimeout(enemyTurn, 300);
    updateHUD();
  } else {
    log("You don't have both Beer and Lightning Bug to combine.");
  }
});

/* =========================
   Enemy HP display and helpers
   ========================= */
function updateEnemyHPDisplay(){
  const el = $('enemyHPDisplay');
  if(state.enemy && state.inCombat){
    el.classList.remove('hidden');
    $('enemyText').innerText = `${state.enemy.name} — HP ${Math.max(0, Math.floor(state.enemy.hp))}`;
    const maxHP = state.enemy.maxHp || state.enemy.hp;
    // maxHP fallback if not provided
    const fill = $('enemyFill');
    // if boss with hp property, we attempt to use known max values; but some enemies may not have normalized max — approximate
    // If enemy has 'origHp' use that as max
    const max = state.enemy.origHp || (state.enemy.boss ? state.enemy.hp : (state.enemy.origHp || Math.max(state.enemy.hp, 1)));
    // We'll store origHp when spawning
    const orig = state.enemy.origHp || state.enemy.hp || 1;
    // If orig is zero or NaN, just set fill to 100%
    let pct = 100;
    if(state.enemy.origHp) pct = Math.max(0, Math.min(100, (state.enemy.hp / state.enemy.origHp) * 100));
    else pct = 100;
    $('enemyFill').style.width = pct + '%';
  } else {
    el.classList.add('hidden');
  }
}

/* =========================
   Spells panel and usage (button-only)
   ========================= */

$('spellsBtn').addEventListener('click', openSpells);
$('closeSpellsBtn')?.addEventListener('click', ()=>{ $('spellsPanel').classList.add('hidden'); });

function openSpells(){
  // build list of spells: per-run spells and permanent spell if present
  $('spellsList').innerHTML = "";
  const list = state.spells.slice();
  if(state.permSpell) list.push(state.permSpell + " (PERMANENT)");
  if(list.length === 0){
    $('spellsList').innerText = "No spells unlocked.";
  } else {
    list.forEach(sp=>{
      const row = document.createElement('div'); row.style.margin='6px';
      const label = document.createElement('div'); label.className='small'; label.innerText = sp;
      const useBtn = document.createElement('button'); useBtn.innerText='USE';
      useBtn.addEventListener('click', ()=>{
        castSpell(sp);
      });
      row.appendChild(label); row.appendChild(useBtn);
      $('spellsList').appendChild(row);
    });
  }
  $('spellsPanel').classList.remove('hidden');
}

/* Cast spell function */
function castSpell(spellName){
  // mapping spells to effects
  // Smite (50 dmg), Rot Nova (35 dmg + reduce enemy dmg by 10 next turn), Hellbrand (70 dmg self 10), Fear Lock (enemy skips next turn), Divine Sever (200 dmg, permanent)
  log(`You cast ${spellName}.`);
  if(!state.enemy){ log("But there's no enemy."); return; }
  if(spellName === "Smite"){
    state.enemy.hp -= 50;
    log("Smite hits for 50.");
  } else if(spellName === "Rot Nova"){
    state.enemy.hp -= 35;
    state.enemy.nextDamageReducer = (state.enemy.nextDamageReducer || 0) + 10;
    log("Rot Nova hits for 35 and reduces enemy damage next turn by 10.");
  } else if(spellName === "Hellbrand"){
    state.enemy.hp -= 70;
    state.player.hp -= 10;
    log("Hellbrand hurts enemy for 70, but you take 10 recoil.");
  } else if(spellName === "Fear Lock"){
    state.enemySkipNext = true;
    log("Fear Lock cast — enemy will lose next turn.");
  } else if(spellName === state.permSpell){
    // Divine Sever or other permanent special
    const dmg = 200;
    state.enemy.hp -= dmg;
    log(`${spellName} unleashes ${dmg} damage!`);
  } else {
    log("Spell unknown or unusable.");
  }
  updateEnemyHPDisplay();
  $('spellsPanel').classList.add('hidden');
  // spells cast consume player's turn -> enemy acts if still alive and not skipped
  setTimeout(()=>{ if(state.enemy && state.enemy.hp>0) enemyTurn(); }, 350);
}

/* =========================
   Boss spawn helper
   ========================= */
function spawnBoss(){
  // set up boss with original HP stored
  if(state.bossIndex >= BOSSES.length) {
    log("No more bosses.");
    return;
  }
  const b = JSON.parse(JSON.stringify(BOSSES[state.bossIndex]));
  b.origHp = b.hp;
  b.boss = true;
  state.enemy = b;
  state.bossIndex++;
  log(`A looming presence: ${b.name} emerges!`);
  state.inCombat = true;
  $('combatArea').classList.remove('hidden');
  $('enemyHPDisplay').classList.remove('hidden');
  updateEnemyHPDisplay();
}

/* =========================
   Helper functions
   ========================= */

function playerDied(){
  log("You have died. The underworld claims you.");
  // end run; keep permanent spell saved if unlocked
  // reset run state except permSpell
  state.player = null;
  $('combatArea').classList.add('hidden');
  $('enemyHPDisplay').classList.add('hidden');
  // show menu again to start new run
  $('menu').classList.remove('hidden');
  $('hud').classList.add('hidden');
  // clear temp items (items are per-run)
  // do not clear permanent spell in localStorage
}

function updateHUD(){
  if(!state.player) return;
  // ensure values exist
  state.player.hp = Math.min(state.player.hp, state.player.maxHp);
  $('playerCard').innerHTML = `<strong>${state.player.name}</strong><div class="small">${state.player.class}</div>
    <div class="small">HP: ${Math.floor(state.player.hp)}/${state.player.maxHp}</div>
    <div class="small">Primary: ${state.player.primaryName} ${state.player.primaryDmg} | Alt: ${state.player.altName} ${state.player.altDmg}</div>`;
  $('roomCard').innerHTML = `<div class="small">Rooms: ${state.roomCount}</div>`;
  $('invSummary').innerText = Object.entries(state.items).filter(([k,v])=>v>0).map(([k,v])=>`${k} x${v}`).join(" • ") || "Empty";
  $('levelNum').innerText = state.level;
  $('xpNum').innerText = state.xp + "/" + state.xpToLevel;
  // quick inv list
  const quick = $('quickInvList'); quick.innerHTML = "";
  Object.entries(state.items).forEach(([k,v])=>{
    if(v>0){
      const p = document.createElement('div'); p.className='pill'; p.innerText = `${k}(${v})`; quick.appendChild(p);
    }
  });
  updateEnemyHPDisplay();
}

/* Utility: random enemy clone */
function pickRandomEnemyFromList(list){
  return JSON.parse(JSON.stringify(list[Math.floor(Math.random()*list.length)]));
}
